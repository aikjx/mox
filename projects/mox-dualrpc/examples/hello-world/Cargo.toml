[package]
name = "mox-dualrpc-example"
version = "0.1.0"
edition = "2021"

[dependencies]
mox-dualrpc = { path = "../.." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
