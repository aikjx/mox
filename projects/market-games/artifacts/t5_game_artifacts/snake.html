<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>贪吃蛇 Snake · 商场游戏</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f1220; color:#e5e7eb; margin:0; display:flex; flex-direction:column; align-items:center; }
  h1 { margin: 12px 0 4px; font-size: 20px; }
  .hud { display:flex; gap:14px; margin:6px 0 10px; font-size:14px; }
  .hud span b { color:#7ee787; }
  canvas { background:#0f1220; border:2px solid #374151; border-radius:6px; touch-action:none; }
  .tip { margin-top: 8px; color:#9ca3af; font-size:12px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row button { padding:4px 12px; background:#1f2937; color:#e5e7eb; border:1px solid #374151; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
  <h1>贪吃蛇 · Snake（商场游戏 market-games）</h1>
  <div class="hud">
    <span>得分 score: <b id="score">0</b></span>
    <span>关卡 level: <b id="level">1</b> / <span id="levels">5</span></span>
    <span>生命 lives: <b id="lives">3</b></span>
  </div>
  <canvas id="game" width="576" height="576"></canvas>
  <div class="row">
    <button id="btn-pause">暂停 Pause (Space)</button>
    <button id="btn-restart">重开 Restart (Enter)</button>
  </div>
  <div class="tip">方向键 / WASD 控制蛇移动；空格暂停；回车重开</div>
<script>
"use strict";
/* Snake game (projects/market-games artifact) — no deps, no eval, no unsafe innerHTML writes */
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const levelsEl = document.getElementById('levels');
  const livesEl = document.getElementById('lives');

  const CELL = 24;
  const COLS = 24;
  const ROWS = 24;
  const LEVELS = 5;
  levelsEl.textContent = String(LEVELS);
  const FOOD_PER_LEVEL = 6;
  const LEVEL_SPEED = [160, 140, 120, 100, 80];

  let raf = 0;
  let lastStepTs = 0;
  let stepMs = LEVEL_SPEED[0];
  let paused = false;
  let score = 0;
  let lives = 3;
  let level = 1;
  let foodsEaten = 0;
  let body = [];
  let dir = [0, 1];
  let pending = [0, 1];
  let food = [0, 0];
  let alive = true;
  let bannerText = '';
  let bannerUntil = 0;

  function resetRound(keepProgress) {
    if (!keepProgress) { score = 0; lives = 3; level = 1; foodsEaten = 0; }
    stepMs = LEVEL_SPEED[Math.min(LEVELS - 1, level - 1)];
    const cy = Math.floor(ROWS / 2), cx = Math.floor(COLS / 2);
    body = [[cy, cx], [cy, cx - 1], [cy, cx - 2]];
    dir = [0, 1];
    pending = [0, 1];
    food = spawnFood();
    alive = true;
    paused = false;
    bannerText = '';
    bannerUntil = 0;
    updateHud();
  }

  function spawnFood() {
    const free = [];
    const occupied = new Set(body.map(p => p[0] * COLS + p[1]));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!occupied.has(r * COLS + c)) free.push([r, c]);
    }
    if (!free.length) return [0, 0];
    return free[Math.floor(Math.random() * free.length)];
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    livesEl.textContent = String(lives);
  }

  function showBanner(text, durationMs) {
    bannerText = text;
    bannerUntil = performance.now() + (durationMs || 1500);
  }

  function opposite(a, b) { return a[0] === -b[0] && a[1] === -b[1]; }

  function onKey(e) {
    const k = e.key;
    if (k === 'Enter') {
      if (!alive) resetRound(false);
      return;
    }
    if (k === ' ' || k === 'Spacebar' || k === 'space') {
      if (alive) paused = !paused;
      e.preventDefault();
      return;
    }
    let nd = null;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') nd = [-1, 0];
    else if (k === 'ArrowDown' || k === 's' || k === 'S') nd = [1, 0];
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') nd = [0, -1];
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') nd = [0, 1];
    if (nd && !opposite(nd, dir)) pending = nd;
  }

  function step() {
    if (!alive || paused) return;
    dir = pending;
    const [hr, hc] = body[0];
    const nr = hr + dir[0], nc = hc + dir[1];
    const outOfBounds = nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS;
    const hitSelf = body.some(p => p[0] === nr && p[1] === nc);
    if (outOfBounds || hitSelf) {
      alive = false;
      lives--;
      updateHud();
      if (lives <= 0) {
        showBanner('游戏结束 GAME OVER  得分: ' + score, 999999);
        stop();
        winLose('lose');
      } else {
        showBanner('撞击！本关重试', 1400);
        score = Math.max(0, score - 30);
        updateHud();
        setTimeout(() => { if (lives > 0) resetRound(true); }, 1400);
      }
      draw();
      return;
    }
    body.unshift([nr, nc]);
    if (nr === food[0] && nc === food[1]) {
      score += 10;
      foodsEaten++;
      updateHud();
      if (foodsEaten >= FOOD_PER_LEVEL) {
        if (level >= LEVELS) {
          score += 1000;
          updateHud();
          showBanner('恭喜通关 YOU WIN！最终得分: ' + score, 999999);
          alive = false;
          stop();
          winLose('win');
        } else {
          score += 300;
          level++;
          foodsEaten = 0;
          stepMs = LEVEL_SPEED[Math.min(LEVELS - 1, level - 1)];
          updateHud();
          showBanner('进入关卡 LEVEL ' + level, 1400);
          setTimeout(() => resetRound(true), 1400);
        }
      }
      food = spawnFood();
    } else {
      body.pop();
    }
  }

  function drawGrid() {
    ctx.fillStyle = '#0f1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1b2040';
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL + 0.5);
      ctx.lineTo(canvas.width, r * CELL + 0.5);
      ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL + 0.5, 0);
      ctx.lineTo(c * CELL + 0.5, canvas.height);
      ctx.stroke();
    }
  }

  function draw() {
    drawGrid();
    const [fr, fc] = food;
    ctx.fillStyle = '#ff5d73';
    ctx.beginPath();
    ctx.arc(fc * CELL + CELL / 2, fr * CELL + CELL / 2, CELL / 2 - 4, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < body.length; i++) {
      const [r, c] = body[i];
      ctx.fillStyle = i === 0 ? '#7CFFB2' : '#39c46e';
      ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    }
    if (paused && alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, canvas.height / 2 - 28, canvas.width, 56);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⏸ 暂停 PAUSED', canvas.width / 2, canvas.height / 2);
    }
    if (bannerText && performance.now() < bannerUntil) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, canvas.height / 2 - 36, canvas.width, 72);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(bannerText, canvas.width / 2, canvas.height / 2);
    }
  }

  function loop(ts) {
    if (!lastStepTs) lastStepTs = ts;
    const elapsed = ts - lastStepTs;
    if (elapsed >= stepMs) {
      lastStepTs = ts;
      step();
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  function winLose(kind) {
    if (kind === 'win') showBanner('YOU WIN 得分: ' + score, 999999);
    if (kind === 'lose') showBanner('GAME OVER 得分: ' + score, 999999);
  }
  function checkWinner(kind) { return winLose(kind); }

  function startGame() {
    stop();
    resetRound(false);
    lastStepTs = 0;
    document.removeEventListener('keydown', onKey);
    document.addEventListener('keydown', onKey);
    const bp = document.getElementById('btn-pause');
    if (bp) bp.onclick = () => { if (alive) paused = !paused; };
    const br = document.getElementById('btn-restart');
    if (br) br.onclick = () => startGame();
    raf = requestAnimationFrame(loop);
  }

  window.startGame = startGame;
  window.winLose = winLose;
  window.checkWinner = checkWinner;
  document.addEventListener('DOMContentLoaded', startGame);
})();
</script>
</body>
</html>
