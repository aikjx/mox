# =============================================================================
# MOX Platform - Clippy configuration
# Enterprise code-quality gate. All warn-level+ lints must pass.
# =============================================================================
# Execution:
#   cargo clippy --workspace --all-targets -- -D warnings
# =============================================================================
#
# NOTE (migration 2026-09-01):
#   lint LEVELS (allow / deny / warn) are declared in the root Cargo.toml
#   under [workspace.lints.clippy]. This file only supports THRESHOLD-style
#   configuration; the previous top-level `allow`/`deny`/`warn` arrays were
#   invalid fields and have been removed.
#
# Reference of migrated lint levels (see root Cargo.toml):
#   allow : new_without_default, too_many_arguments, type_complexity, module_inception
#   deny  : correctness, suspicious, out_of_bounds_indexing, unused_result_ok, duplicate_key
#
# Optional threshold tuning (examples, uncomment to apply):
#   too-many-arguments-threshold = 8
#   type-complexity-threshold = 300
#   cognitive-complexity-threshold = 25
