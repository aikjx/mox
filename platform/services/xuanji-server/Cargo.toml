[package]
name = "xuanji-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Xuanji v2.0 AIS-grade fusion single-binary server: CLI, O11y, Bench/Deploy smoke tests"

[lib]
name = "xuanji_server"
path = "src/lib.rs"

[[bin]]
name = "xuanji-server"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
prometheus = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# Workspace path crates
xuanji-data-plane = { path = "../xuanji-data-plane" }
xuanji-compliance = { path = "../xuanji-compliance" }
xuanji-etl-wasm = { path = "../xuanji-etl-wasm" }
xuanji-fusion = { path = "../xuanji-fusion" }
xuanji-cloud-drive-volume = { path = "../xuanji-cloud-drive-volume", features = [] }
xuanji-standards = { path = "../xuanji-standards", features = [] }

[features]
default = []
# Enable SIMD AVX2 / NEON vectorised GF(2^8) multiply in EC volume path.
simd = ["xuanji-cloud-drive-volume/simd"]
# Enable GM SM-3 / SM-2 / SM-4-GCM ciphers for STS dual signing, audit
# hash chain, and object payload encryption.
gm-sm = ["xuanji-standards/gm-sm"]
# Enable SM3 + SHA-256 dual audit chain for migration windows.
dual_chain = ["xuanji-standards/dual_chain"]
# Enable Glacier 4th storage class, adapter & restore state machine.
glacier = []

[dev-dependencies]
tempfile = "3"
rand = "0.8"
