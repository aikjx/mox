[package]
name = "xuanji-cloud-drive-master"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "Xuanji Cloud Drive L4 Master (Control Plane) - self-implemented, no external storage system"

[dependencies]
xuanji-domain-abstractions = { path = "../xuanji-domain-abstractions" }
tokio = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = "0.8"
bytes = "1"

[dev-dependencies]
tempfile = "3"
xuanji-cloud-drive-volume = { path = "../xuanji-cloud-drive-volume" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
