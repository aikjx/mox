[package]
name = "xuanji-cloud-drive-s3"
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Xuanji - 最高权限璇玑"]
description = "Xuanji Cloud Drive S3 Compatible Service - 100% self-implemented (no third-party storage engines)"

[dependencies]
xuanji-domain-abstractions = { path = "../xuanji-domain-abstractions" }
xuanji-standards = { path = "../xuanji-standards" }
xuanji-cloud-drive-master = { path = "../xuanji-cloud-drive-master" }
xuanji-cloud-drive-volume = { path = "../xuanji-cloud-drive-volume" }
tokio = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xml-rs = "0.8"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
bytes = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
md-5 = "0.10"
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
