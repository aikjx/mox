[package]
name = "xuanji-t21-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Xuanji v2.0 T21 E2E Harness (>=700 integration tests) + Task12 Rubric Grade Calculator"

[lib]
name = "xuanji_t21_harness"
path = "src/lib.rs"

[dependencies]
# Internal xuanji path crates
xuanji-cloud-drive-volume = { path = "../xuanji-cloud-drive-volume" }
xuanji-compliance = { path = "../xuanji-compliance" }
xuanji-fusion = { path = "../xuanji-fusion" }
xuanji-server = { path = "../xuanji-server" }
xuanji-data-plane = { path = "../xuanji-data-plane" }
xuanji-etl-wasm = { path = "../xuanji-etl-wasm" }

# Workspace-shared common crates
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rand = "0.8"
tempfile = "3"
