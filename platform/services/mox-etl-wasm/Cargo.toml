[package]
name = "mox-etl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mox ETL near-data plugin framework (WASM ABI: inline-get/inline-put/offline xaction)"

[lib]
name = "mox_etl_wasm"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# WASM runtime (optional feature — build with --features "wasm-runtime" in prod)
wasmer = { version = "4.2", optional = true }
wasmer-compiler-cranelift = { version = "4.2", optional = true }

[features]
default = []
wasm-runtime = ["dep:wasmer", "dep:wasmer-compiler-cranelift"]

[dev-dependencies]
tempfile = "3"
rand = "0.8"
