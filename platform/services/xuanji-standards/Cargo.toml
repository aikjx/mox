[package]
name = "xuanji-standards"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "Xuanji V5 10 Standards Matrix Test Crate (SigV4 / CRC32C+ETag / RFC5424 / FIPS HMAC / nGQL / openCypher / ISO GQL / POSIX / AIS / 等保 hash_chain)"

[dependencies]
xuanji-domain-abstractions = { path = "../xuanji-domain-abstractions" }
tokio = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
parking_lot = { workspace = true }
bytes = "1"
rand = { workspace = true, optional = true }
num-bigint = { version = "0.5.1", features = ["std"] }
num-traits.workspace = true

[features]
gm-sm = ["dep:rand"]
dual_chain = ["gm-sm"]

[dev-dependencies]
