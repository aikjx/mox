# MOX Enterprise Prometheus 告警规则
# 37 项 SLO 指标体系 - 告警规则定义
groups:
  - name: mox-availability
    interval: 30s
    rules:
      - alert: MOXServiceDown
        expr: up{job="mox-api"} == 0
        for: 1m
        labels:
          severity: P0
          category: availability
        annotations:
          summary: "MOX API 服务不可用"
          description: "实例 {{ $labels.instance }} 已宕机超过 1 分钟"
          runbook: "https://wiki.infotopograph.io/runbook/mox-service-down"

      - alert: MOXHighErrorRate
        expr: |
          sum(rate(mox_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(mox_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: P1
          category: availability
        annotations:
          summary: "MOX 5xx 错误率 > 1%"
          description: "当前 5xx 错误率: {{ $value | humanizePercentage }}"

      - alert: MOXReadSuccessRateLow
        expr: |
          sum(rate(mox_storage_operations_total{operation="read",status="success"}[5m]))
          /
          sum(rate(mox_storage_operations_total{operation="read"}[5m])) < 0.999
        for: 10m
        labels:
          severity: P1
          category: availability
        annotations:
          summary: "读成功率 < 99.9%"

  - name: mox-latency
    interval: 30s
    rules:
      - alert: MOXHighP999Latency
        expr: histogram_quantile(0.999, sum(rate(mox_http_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: P1
          category: latency
        annotations:
          summary: "API p999 延迟 > 5s"
          description: "当前 p999: {{ $value }}s"

      - alert: MOXHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(mox_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: P2
          category: latency
        annotations:
          summary: "API p95 延迟 > 1s"

      - alert: MOXMetadataQuerySlow
        expr: histogram_quantile(0.95, sum(rate(mox_metadata_query_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: P2
          category: latency
        annotations:
          summary: "元数据查询 p95 > 500ms"

  - name: mox-throughput
    interval: 1m
    rules:
      - alert: MOXThroughputDrop
        expr: |
          sum(rate(mox_storage_operations_total{operation="write"}[10m]))
          <
          sum(rate(mox_storage_operations_total{operation="write"}[1h] offset 1h)) * 0.5
        for: 15m
        labels:
          severity: P2
          category: throughput
        annotations:
          summary: "写入吞吐较昨日同期下降 >50%"

  - name: mox-data-integrity
    interval: 1m
    rules:
      - alert: MOXECRepairQueueHigh
        expr: mox_ec_repair_queue_depth > 1000
        for: 10m
        labels:
          severity: P1
          category: integrity
        annotations:
          summary: "EC 修复队列深度 > 1000"
          description: "当前待修复分片数: {{ $value }}"

      - alert: MOXShardSkewHigh
        expr: |
          (max(mox_shard_object_count) - avg(mox_shard_object_count))
          /
          avg(mox_shard_object_count) > 0.25
        for: 30m
        labels:
          severity: P2
          category: integrity
        annotations:
          summary: "分片偏差 > 25%，需要扩容或再均衡"

      - alert: MOXChecksumMismatch
        expr: increase(mox_checksum_verification_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: P0
          category: integrity
        annotations:
          summary: "检测到数据校验和不匹配"
          description: "过去 1 小时内 {{ $value }} 次校验失败，可能存在数据损坏"

      - alert: MOXRefCountInconsistency
        expr: increase(mox_ref_count_inconsistencies_total[1h]) > 0
        for: 0m
        labels:
          severity: P1
          category: integrity
        annotations:
          summary: "引用计数不一致"

  - name: mox-system-health
    interval: 1m
    rules:
      - alert: MOXDiskUsageHigh
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: P2
          category: system
        annotations:
          summary: "磁盘使用率 > 85%"
          description: "节点 {{ $labels.instance }} 磁盘使用率: {{ $value | humanizePercentage }}"

      - alert: MOXDiskUsageCritical
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 95
        for: 5m
        labels:
          severity: P1
          category: system
        annotations:
          summary: "磁盘使用率 > 95%"

      - alert: MOXMemoryUsageHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: P2
          category: system
        annotations:
          summary: "内存使用率 > 90%"

      - alert: MOXCrossRegionReplicationLag
        expr: mox_cross_region_replication_lag_seconds > 300
        for: 10m
        labels:
          severity: P1
          category: system
        annotations:
          summary: "跨 Region 复制延迟 > 5 分钟（RPO 超标）"

      - alert: MOXCacheHitRateLow
        expr: rate(mox_cache_hits_total[5m]) / (rate(mox_cache_hits_total[5m]) + rate(mox_cache_misses_total[5m])) < 0.5
        for: 15m
        labels:
          severity: P2
          category: system
        annotations:
          summary: "缓存命中率 < 50%"

      - alert: MOXConnectionPoolExhausted
        expr: mox_db_connection_pool_active_connections / mox_db_connection_pool_max_connections > 0.9
        for: 5m
        labels:
          severity: P1
          category: system
        annotations:
          summary: "数据库连接池使用率 > 90%"
