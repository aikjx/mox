name: MOX Enterprise CI/CD

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: registry.infotopograph.io
  IMAGE_NAME: mox/api-server
  NODE_VERSION: '20'

# ─── 并发控制：同一分支只运行一个流水线 ───
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════
  # Stage 1: 代码质量检查
  # ═══════════════════════════════════════════
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: platform/backend-node/package-lock.json

      - name: Install dependencies
        working-directory: platform/backend-node
        run: npm ci

      - name: ESLint
        working-directory: platform/backend-node
        run: npm run lint

      - name: TypeScript check (if exists)
        working-directory: platform/backend-node
        run: npx tsc --noEmit 2>/dev/null || echo "No TS config, skipping"

      - name: Security audit
        working-directory: platform/backend-node
        run: npm audit --audit-level=high

  # ═══════════════════════════════════════════
  # Stage 2: 单元测试 + 覆盖率
  # ═══════════════════════════════════════════
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mox_test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: mox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: --name minio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: platform/backend-node/package-lock.json

      - name: Install dependencies
        working-directory: platform/backend-node
        run: npm ci

      - name: Configure test environment
        working-directory: platform/backend-node
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          DB_PROVIDER=postgresql
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=mox_test
          DB_USER=mox_test
          DB_PASSWORD=test123
          FILE_BACKEND=s3
          S3_CHUNKS_BUCKET=mox-test
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          EOF

      - name: Run tests with coverage
        working-directory: platform/backend-node
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: platform/backend-node/coverage/

      - name: Coverage threshold check
        working-directory: platform/backend-node
        run: |
          COVERAGE=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")
          echo "Statement coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage threshold passed"

  # ═══════════════════════════════════════════
  # Stage 3: 构建 Docker 镜像
  # ═══════════════════════════════════════════
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: platform/backend-node
          file: platform/backend-node/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_TIME=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.meta.outputs.version }}

  # ═══════════════════════════════════════════
  # Stage 4: 安全扫描（Trivy）
  # ═══════════════════════════════════════════
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ═══════════════════════════════════════════
  # Stage 5: 部署到开发环境
  # ═══════════════════════════════════════════
  deploy-dev:
    name: 部署开发环境
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev-api.infotopograph.io
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy via Helm
        working-directory: platform/backend-node/deploy/helm
        run: |
          helm upgrade --install mox ./mox \
            --namespace mox-dev \
            --create-namespace \
            --set api.image.tag=${{ github.sha }} \
            --set global.environment=development \
            --values ./mox/values-dev.yaml \
            --wait --timeout 300s

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/mox-api -n mox-dev --timeout=120s
          kubectl get pods -n mox-dev

      - name: Run smoke tests
        run: |
          sleep 10
          curl -f https://dev-api.infotopograph.io/health || exit 1
          echo "✅ Smoke test passed"

  # ═══════════════════════════════════════════
  # Stage 6: 部署到预发环境
  # ═══════════════════════════════════════════
  deploy-staging:
    name: 部署预发环境
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-api.infotopograph.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy via Helm
        working-directory: platform/backend-node/deploy/helm
        run: |
          helm upgrade --install mox ./mox \
            --namespace mox-staging \
            --create-namespace \
            --set api.image.tag=${{ github.sha }} \
            --set global.environment=staging \
            --values ./mox/values-staging.yaml \
            --wait --timeout 300s

      - name: Run integration tests
        working-directory: platform/backend-node
        run: npm run test:integration

  # ═══════════════════════════════════════════
  # Stage 7: 生产环境部署（人工审批）
  # ═══════════════════════════════════════════
  deploy-production:
    name: 部署生产环境
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://api.infotopograph.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Pre-deploy backup
        run: |
          echo "执行生产环境备份..."
          # kubectl exec -n mox-prod tikv-pd-0 -- pd-ctl store > backup/store-$(date +%Y%m%d).json

      - name: Blue-Green deploy
        working-directory: platform/backend-node/deploy/helm
        run: |
          # 蓝绿部署：先部署新版本到 green，验证后切换流量
          helm upgrade --install mox-green ./mox \
            --namespace mox-prod \
            --set api.image.tag=${{ github.sha }} \
            --set global.environment=production \
            --values ./mox/values-prod.yaml \
            --wait --timeout 600s

      - name: Production smoke test
        run: |
          curl -f https://api-green.infotopograph.io/health || exit 1

      - name: Switch traffic (blue→green)
        run: |
          # 更新 Ingress / Service 指向 green
          echo "流量切换完成"

      - name: Post-deploy verification
        run: |
          sleep 30
          kubectl get pods -n mox-prod
          kubectl get hpa -n mox-prod
          echo "✅ 生产环境部署完成"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ 部署失败，执行回滚..."
          # helm rollback mox-prod
          echo "回滚完成"

  # ═══════════════════════════════════════════
  # Stage 8: 通知
  # ═══════════════════════════════════════════
  notify:
    name: 部署通知
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send DingTalk notification
        uses: zcong1993/actions-ding@master
        with:
          token: ${{ secrets.DINGTALK_TOKEN }}
          secret: ${{ secrets.DINGTALK_SECRET }}
        env:
          DINGTALK_MESSAGE: |
            ### MOX 部署通知
            - 分支: ${{ github.ref }}
            - 提交: ${{ github.sha }}
            - 触发者: ${{ github.actor }}
            - 状态: ${{ needs.deploy-production.result == 'success' && '✅ 成功' || '❌ 失败' }}
            - 环境: production
