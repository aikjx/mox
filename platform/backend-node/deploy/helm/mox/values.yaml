# MOX Enterprise Helm Values
# ============================================================

# ─── 全局配置 ───
global:
  environment: production
  region: ap-southeast-1
  tier: enterprise
  imageRegistry: registry.infotopograph.io
  imagePullSecrets: []
  storageClass: ceph-ssd
  logLevel: info

# ─── API 服务（接入层 + 计算层） ───
api:
  replicaCount: 3
  image:
    repository: mox/api-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3010
    targetPort: 3010
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /health
      port: 3010
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: 3010
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: mox-api
            topologyKey: kubernetes.io/hostname

# ─── 元数据服务（TiKV 客户端层） ───
metadata:
  replicaCount: 3
  image:
    repository: mox/metadata-service
    tag: latest
  service:
    port: 3011
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  tikv:
    pdEndpoints: "tikv-pd-0.tikv-pd:2379,tikv-pd-1.tikv-pd:2379,tikv-pd-2.tikv-pd:2379"
    shardCount: 256
    vnodeCount: 1024

# ─── 存储后端配置 ───
storage:
  backend: s3
  s3:
    bucket: mox-chunks-prod
    region: ap-southeast-1
    endpoint: ""
    forcePathStyle: false
    useAccelerateEndpoint: true
  compression:
    enabled: true
    algorithm: zstd
    level: 3
  dedup:
    enabled: true
    algorithm: sha256
  lifecycle:
    hotDays: 30
    warmDays: 365
    coldArchive: true

# ─── 容错配置 ───
faultTolerance:
  ecProfile: "12+4"
  replicationFactor: 3
  hotDataReplication: true
  crossAZ: true
  crossRegion:
    enabled: true
    targetRegions:
      - eu-central-1
      - us-east-1
    rpoMinutes: 5

# ─── Ingress ───
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.infotopograph.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mox-api-tls
      hosts:
        - api.infotopograph.io

# ─── 可观测 ───
observability:
  prometheus:
    enabled: true
    scrapeInterval: 15s
    serviceMonitor:
      enabled: true
      namespace: monitoring
  tracing:
    enabled: true
    exporter: otlp
    endpoint: http://otel-collector.monitoring:4317
    sampleRate: 0.1
  logs:
    level: info
    format: json
    exportToLoki: true

# ─── 安全 ───
security:
  rbac:
    enabled: true
  tls:
    enabled: true
    certSecret: mox-tls
  auditLog:
    enabled: true
    retentionDays: 365
  encryption:
    atRest: true
    inTransit: true
    algorithm: AES-256-GCM

# ─── Spark 计算（批处理） ───
spark:
  enabled: true
  image:
    repository: mox/spark-runner
    tag: 3.5.0
  driver:
    cores: 2
    memory: 4g
  executor:
    instances: 10
    cores: 4
    memory: 8g
  dynamicAllocation:
    enabled: true
    minExecutors: 2
    maxExecutors: 100

# ─── 网络策略 ───
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3010
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
