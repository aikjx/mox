[package]
name = "mox-platform-gateway-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MOX L1 企业级网关：axum 单二进制 · 31域模块化路由 · 8080 全面接管原 backend-node"

[[bin]]
name = "mox-server"
path = "src/main.rs"

[dependencies]
# 通用工具链
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
parking_lot = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
prometheus = { workspace = true }

# HTTP 框架（直接构建，无需 feature 开关）
axum = { workspace = true, features = ["json", "query", "http1", "tokio", "multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "compression-full", "timeout"] }

# 在线日志/可观测性（Actuator 管理面 + SSE 实时日志流）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }

# 企业级基础层 & 业务域
mox-framework = { workspace = true }
mox-kg-service-svc = { workspace = true, features = ["http-adapter"] }
mox-kb-svc = { workspace = true }
mox-platform-foundation = { workspace = true }
mox-platform-api = { workspace = true }

# 平台 IAM 核心（/system/* · /security/* 真实数据链路）+ SQLite
mox-platform-iam-core = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }

# 联盟域 API（DTO 类型契约 + 真实调度/执行核心）
mox-alliance-api = { workspace = true }
mox-alliance-scheduler-core = { workspace = true }
mox-alliance-common-proto = { workspace = true }
mox-alliance-scheduler-proto = { workspace = true }

# 业务域反向代理（网关→编排器适配层，L6 归一化收敛）
reqwest = { workspace = true }

[features]
default = []
# SIMD AVX2 / NEON 向量化 GF(2^8) 乘法（EC Volume 扩展，留接口）
simd = []
# 国密 GM SM-3 / SM-2 / SM-4-GCM（留接口）
gm-sm = []
# 双审计链 SM3 + SHA-256（迁移窗口期，留接口）
dual_chain = []
# Glacier 第 4 存储等级（留接口）
glacier = []

[dev-dependencies]
tempfile = "3"
rand = "0.8"

