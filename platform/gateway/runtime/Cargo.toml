[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "operator-server"
path = "src/main.rs"

[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
xuanji-common-meta = { path = "../../services/xuanji-common-meta" }
operator-core = { path = "../../services/operator-core" }
graph-algorithms = { path = "../../services/graph-algorithms" }
operator-wasm = { path = "../../services/operator-wasm" }
optimizer = { path = "../../services/optimizer" }
ai-agent = { path = "../../services/ai-agent" }
business-catalog = { path = "../../services/business-catalog" }
xuanji-expert = { path = "../../services/xuanji-expert" }
flow-ai = { path = "../../services/flow-ai" }
# 子服务聚合（Phase 1 收敛）：四套并行 server 以库方式挂载，由 runtime 唯一对外暴露。
# 各自 bin 保留为独立部署选项，生产统一走 operator-server。
xuanji-system = { path = "../../services/xuanji-system" }
primiflow-core = { path = "../../services/primiflow-core", features = ["server"] }
primiflow-fusion = { path = "../../services/primiflow-fusion" }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nalgebra = { workspace = true, features = ["serde-serialize"] }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
# T2 跨 crate 常量一致性测试：runtime 的集成测试需要能 extern crate 全部 15 个 workspace 成员。
hermes-flow-bridge = { path = "../../services/hermes-flow-bridge" }
template-market = { path = "../../services/template-market" }
kg-hub = { path = "../../services/kg-hub" }

[features]
# 治理台 API（/api/governance/*）：挂载 OUS 前端治理台的全部 REST + WebSocket 端点。
# 默认启用，使治理台随运行时二进制一同编译与暴露。
default = ["governance"]
governance = []
