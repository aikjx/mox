# =============================================================================
# MOX mox-kg-server 配置示例
# 复制为 server.toml 并按需修改
# 环境变量覆盖：MOX_SERVER_HOST / MOX_SERVER_PORT / MOX_LOG_LEVEL
# =============================================================================

[server]
host = "0.0.0.0"
port = 8101
timeout_secs = 30
body_limit = 10485760  # 10MB

[observability]
log_level = "info"
json_log = false
metrics_enabled = true
tracing_enabled = true

[cache]
enabled = true
backend = "memory"  # memory | redis
memory_max_entries = 10000
default_ttl_secs = 300
# redis_url = "redis://localhost:6379/0"

[database]
# 生产环境配置（当前为内存存储演示）
# url = "postgres://user:pass@localhost:5432/mox_kg"
# max_connections = 20
# min_connections = 5