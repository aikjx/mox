[package]
name = "mox-kg-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MOX 知识图谱可选独立服务（端口 3411）"

[[bin]]
name = "mox-kg-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
mox-server-runtime = { path = "../../../../shared/mox-server-runtime" }
mox-kg-core = { path = "../../../platform/core/mox-kg-core" }
mox-kg-algo-core = { path = "../../core/mox-kg-algo-core" }
mox-kg-meta-core = { path = "../../core/mox-kg-meta-core" }
mox-cache-core = { path = "../../../../shared/mox-cache-core" }
mox-kg-service-svc = { path = "../mox-kg-service-svc", features = ["http-adapter"] }
mox-kg-storage-svc = { workspace = true, features = ["http"] }

[features]
# 部署形态默认持久化：RocksDB + ack 前 fsync WAL（构建需 clang/libclang-dev，见 Dockerfile.rust-service）。
# 本地快速迭代可用 --no-default-features 回退内存引擎。
default = ["persist-rocksdb"]
persist-rocksdb = ["mox-kg-service-svc/persist-rocksdb", "mox-kg-storage-svc/persist-rocksdb"]

[lints]
workspace = true
