[package]
name = "mox-kg-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MOX 知识图谱独立微服务（可单独部署，端口 8101）"

[[bin]]
name = "mox-kg-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
mox-server-runtime = { path = "../../../../shared/mox-server-runtime" }
mox-kg-core = { path = "../../../platform/core/mox-kg-core" }
mox-kg-algo-core = { path = "../../core/mox-kg-algo-core" }
mox-kg-meta-core = { path = "../../core/mox-kg-meta-core" }
mox-cache-core = { path = "../../../../shared/mox-cache-core" }
mox-kg-service-svc = { path = "../mox-kg-service-svc", features = ["http-adapter"] }
