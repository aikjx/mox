[package]
name = "mox-kg-storage-svc"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "Mox R2 Graph Storage Service: RocksDB K-V + Sharded Raft + 7 Storage APIs + CDC (100% self-engineered)"

[features]
default = []
# RocksDB snapshot persistence (Apache-2.0). Default off so unit tests are fast and build on
# systems without libclang; the public API surface is identical between mem/rocks impls.
persist-rocksdb = ["dep:rocksdb"]
# HTTP 薄壳（供 mox-kg-server 等宿主挂载 /storage/v1；见 src/http_api.rs）
http = ["dep:axum", "dep:mox-api-protocol", "mox-api-protocol/axum-integration"]

[dependencies]
mox-cloud-foundation = { workspace = true }
mox-kg-meta-core = { workspace = true }
mox-kg-algo-core = { workspace = true }
rocksdb = { version = "0.25", optional = true }
async-raft = "0.6"
tokio = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
rand = "0.8"
thiserror = { workspace = true }
bytes = "1"
chrono = { workspace = true }
petgraph = { workspace = true }
rusqlite = { workspace = true }
axum = { workspace = true, optional = true }
mox-api-protocol = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true
