[package]
name = "mox-kg-service-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mox R3 Graph Service - nGQL 60 + openCypher 20 Parser + Optimizer + 7 Rust Algo Bridge (Enterprise)"

[dependencies]
mox-cloud-foundation = { workspace = true }
mox-kg-storage-svc = { workspace = true }
mox-kg-meta-core = { workspace = true }
mox-kg-algo-core = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
nom = "7"
bytes = "1"
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
mox-framework = { workspace = true, optional = true }
serde_qs = { version = "0.12", optional = true }

[features]
default = []
# 启用 KG/AI HTTP 适配层：桥接 mox-kg-algo-core ↔ axum，暴露 6+4 接口
http-adapter = ["dep:chrono", "dep:axum", "dep:mox-framework", "dep:serde_qs"]

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }
