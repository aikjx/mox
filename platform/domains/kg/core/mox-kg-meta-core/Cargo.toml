[package]
name = "mox-kg-meta-core"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true

[features]
default = []
# RocksDB snapshot persistence (Apache-2.0). Default off so unit tests are fast;
# declare the dep unconditionally per spec (TR5.6).
persist-rocksdb = ["dep:rocksdb"]

[dependencies]
mox-cloud-foundation = { workspace = true }
async-raft = "0.6"
rocksdb = { version = "0.25", optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
