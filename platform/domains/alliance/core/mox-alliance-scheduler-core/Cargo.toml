[package]
name = "mox-alliance-scheduler-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 调度器核心（任务调度 + 专家匹配 + 计划生成 + 专家注册桥接）"

[dependencies]
mox-alliance-common-proto = { workspace = true }
mox-alliance-scheduler-proto = { workspace = true }
mox-alliance-executor-proto = { workspace = true }
mox-alliance-core = { workspace = true }
mox-alliance-config-core = { workspace = true }
mox-platform-foundation = { workspace = true }
mox-error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []
# 启用 HTTP 专家注册桥接（保留向后兼容）
http-bridge = ["reqwest"]

[lints]
workspace = true
