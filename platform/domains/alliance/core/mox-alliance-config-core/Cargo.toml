[package]
name = "mox-alliance-config-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 模块化配置引擎（每模块独立LLM+Graph配置 + 热更新 + 版本管理）"

[dependencies]
mox-alliance-common-proto = { path = "../../proto/mox-alliance-common-proto" }
mox-platform-foundation = { workspace = true }
mox-error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []

[lints]
workspace = true
