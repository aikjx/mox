[package]
name = "mox-alliance-executor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 执行器核心（DAG执行引擎 + 节点调度）"

[dependencies]
mox-alliance-common-proto = { path = "../../proto/mox-alliance-common-proto" }
mox-alliance-executor-proto = { path = "../../proto/mox-alliance-executor-proto" }
mox-alliance-core = { path = "../mox-alliance-core" }
mox-ai-expert-proto = { path = "../../../ai/proto/mox-ai-expert-proto" }
mox-platform-foundation = { workspace = true }
mox-error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
mox-alliance-scheduler-proto = { path = "../../proto/mox-alliance-scheduler-proto" }
mox-alliance-scheduler-core = { path = "../mox-alliance-scheduler-core" }

[features]
default = []

[lints]
workspace = true
