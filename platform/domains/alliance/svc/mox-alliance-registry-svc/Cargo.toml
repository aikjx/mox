[package]
name = "mox-alliance-registry-svc"
version = "0.1.0"
edition = "2021"
description = "专家注册中心服务（v3 拆分）"

[[bin]]
name = "mox-alliance-registry"
path = "src/bin/main.rs"

[dependencies]
# 共享协议
mox-alliance-common-proto = { workspace = true }
mox-alliance-registry-proto = { workspace = true }

# Web 框架
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 工具
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
# 测试用依赖（HTTP 端到端：axum Router + oneshot）
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
