[package]
name = "mox-alliance-executor-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 执行器服务（DAG执行 + 节点调度 + 状态管理）"

[dependencies]
mox-alliance-common-proto = { workspace = true }
mox-alliance-executor-proto = { workspace = true }
mox-alliance-executor-core = { path = "../../core/mox-alliance-executor-core" }
# 执行状态持久化底座：复用 scheduler-core 既有 TaskRepository 实现（不另造存储轮子）。
# `sqlite` feature 仅在 svc 层启用——executor-core 仍零 IO（只依赖 ExecutionStateSink 端口）。
mox-alliance-scheduler-core = { path = "../../core/mox-alliance-scheduler-core", features = ["sqlite"] }
mox-alliance-boot-config = { path = "../../core/mox-alliance-boot-config", features = ["nacos", "naming"] }
mox-alliance-api = { path = "../../api" }
mox-ai-expert-proto = { path = "../../../ai/proto/mox-ai-expert-proto" }
mox-ai-expert-svc = { path = "../../../ai/svc/mox-ai-expert-svc" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
# 集成测试需要 executor-core 的 Mock 节点执行器；仅测试构建启用 mock feature（生产路径不开启）
mox-alliance-executor-core = { path = "../../core/mox-alliance-executor-core", features = ["mock"] }

[[bin]]
name = "mox-alliance-executor"
path = "src/bin/main.rs"

[features]
default = []

[lints]
workspace = true
