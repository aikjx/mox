[package]
name = "mox-alliance-executor-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 执行器服务（DAG执行 + 节点调度 + 状态管理）"

[dependencies]
mox-alliance-common-proto = { path = "../../proto/mox-alliance-common-proto" }
mox-alliance-executor-proto = { path = "../../proto/mox-alliance-executor-proto" }
mox-alliance-executor-core = { path = "../../core/mox-alliance-executor-core" }
mox-alliance-boot-config = { path = "../../core/mox-alliance-boot-config", features = ["nacos", "naming"] }
mox-alliance-api = { path = "../../api" }
mox-ai-expert-svc = { path = "../../../ai/svc/mox-ai-expert-svc" }
mox-ai-expert-proto = { path = "../../../ai/proto/mox-ai-expert-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[[bin]]
name = "mox-alliance-executor"
path = "src/bin/main.rs"

[features]
default = []

[lints]
workspace = true
