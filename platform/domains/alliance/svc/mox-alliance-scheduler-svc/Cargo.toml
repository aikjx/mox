[package]
name = "mox-alliance-scheduler-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "专家联盟 · 调度器服务（任务调度 + 专家匹配 + 计划生成）"

[dependencies]
mox-api-crypto = { workspace = true }
mox-alliance-common-proto = { workspace = true }
mox-alliance-scheduler-proto = { workspace = true }
mox-alliance-executor-proto = { workspace = true }
mox-alliance-scheduler-core = { path = "../../core/mox-alliance-scheduler-core", features = ["http-bridge", "sqlite"] }
mox-alliance-config-core = { workspace = true }
mox-alliance-boot-config = { path = "../../core/mox-alliance-boot-config", features = ["nacos", "naming"] }
mox-alliance-api = { path = "../../api" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }

[[bin]]
name = "mox-alliance-scheduler"
path = "src/bin/main.rs"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[features]
default = []

[lints]
workspace = true
