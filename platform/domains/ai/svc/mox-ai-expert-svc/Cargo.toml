[package]
name = "mox-ai-expert-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "璇玑 · 全维处理工具流程图：七位专家并行诊断 + 归一化裁决 + 企业治理，复用 flow-ai 引擎做最优求解"

[dependencies]
mox-platform-foundation = { workspace = true }
mox-ai-expert-proto = { workspace = true }
mox-ai-flow-svc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
# 双璇玑十四维专家并行派发（run_experts 真并行，消除串行假并行）
rayon = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
hostname = { workspace = true }
tracing = { workspace = true }
# S3 审计后端：真实 HTTP(S) 上传（SigV4 签名手写，见 audit/s3.rs）
reqwest = { workspace = true, features = ["blocking"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
# KG 图谱 SDK（进程内连接器，用于开发/测试场景）
mox-kg-sdk = { workspace = true }
# M3：SQLite 持久化（bundled，免系统依赖）
rusqlite = { workspace = true }

[features]
default = ["rayon"]
# 并行咨询（真并行）：关闭则退化为顺序单线程，API 不变
rayon = []

[[example]]
name = "profile_deep_chain"
path = "examples/profile_deep_chain.rs"

[[example]]
name = "cem_probe"
path = "examples/cem_probe.rs"

[lints]
workspace = true
