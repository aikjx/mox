[package]
name = "mox-ai-alliance-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "璇玑 · 专家联盟架构分析引擎（P2 架构解耦阶段 5）：意图分类 → 专家组队 → 并行辩论 → 归一合成 → 质量门禁 → 知识沉淀，6 阶段管线独立 crate"

[dependencies]
# L5 领域协议层（DIP：engine 依赖 proto，proto 不依赖 engine）
mox-ai-expert-proto = { workspace = true }
# 十四维专家核心引擎（专家注册表 / 裁决器等复用）
mox-ai-expert-core = { workspace = true }
# 平台级管线框架（阶段编排、上下文流转、钩子机制、插件系统）
mox-pipeline-framework = { workspace = true, features = ["async", "audit"] }
# 统一审计（SHA-256 哈希链 + 多 Sink）
mox-audit = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 并行计算（专家并行咨询真并行）
rayon = { workspace = true }

# 异步 trait
async-trait = { workspace = true }

# 时间
chrono = { workspace = true, features = ["serde"] }

# UUID
uuid = { workspace = true, features = ["serde", "v4"] }

# tokio 运行时
tokio = { workspace = true }

# 流式 SSE 支持
futures-util = { workspace = true }

# HTTP 客户端（LLM API 调用）—— 可选 feature：core 默认纯计算（零 IO 依赖）。
# 仅在启用 `llm-http` feature 时才携带 reqwest 实现的 HttpLLMConsultant / SwitchableConsultant。
# 同构于既有 `pg` feature 沙箱 sqlx 的模式（adapter 层职责隔离）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# 数据库持久化（PostgreSQL）—— 可选 feature：core 默认纯计算（无 IO 依赖），
# 仅在启用 `pg` feature 时才携带 sqlx 实现（adapter 层职责）。见 src/persistence.rs。
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "macros"], optional = true }

# 统一归一化契约
mox-unified-contract = { workspace = true }

# 日志
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = ["rayon"]
# 并行咨询（真并行）：关闭则退化为顺序单线程，API 不变
rayon = []
# 生产持久化（PostgreSQL 适配层）：启用后 core 才携带 sqlx 实现的 DatabaseTaskRepository
pg = ["sqlx"]
# HTTP LLM 咨询器（adapter 层）：启用后 core 才携带 reqwest 实现的 HttpLLMConsultant /
# SwitchableConsultant。纯领域逻辑（LLMConfig / ChatMessage / ExpertOpinionJSON 等）始终可用。
llm-http = ["reqwest"]

[lints]
workspace = true
