[package]
name = "mox-rbac-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MOX 平台级 RBAC 权限引擎 — RBAC+ABAC 混合模型、角色继承链、策略引擎、LRU 缓存、可插拔存储、事件系统"

[dependencies]
mox-error = { workspace = true, optional = true }
mox-audit = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# 集成 mox-error 统一错误码系统
mox-error = ["dep:mox-error"]
# 集成 mox-audit 审计（权限拒绝自动产生审计事件）
audit = ["dep:mox-audit", "dep:tracing"]
# 序列化/反序列化支持
serde = ["dep:serde"]

[lib]
path = "src/lib.rs"
