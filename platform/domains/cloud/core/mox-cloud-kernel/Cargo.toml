[package]
name = "mox-cloud-kernel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "Mox Cloud L5 Pure Algorithm Kernel — zero business dependency (Reed-Solomon EC, GF(2^8) SIMD, hedged read/multi-write arbitration, backpressure, buffer pool, reader capability, scan budget)"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

[features]
default = ["simd"]
simd = []

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true, features = ["html_reports", "rayon"] }

[[bench]]
name = "reed_solomon_bench"
harness = false

[[bench]]
name = "buffer_pool_bench"
harness = false

[[bench]]
name = "backpressure_bench"
harness = false

[[bench]]
name = "multi_writer_bench"
harness = false

[[bench]]
name = "hedged_reader_bench"
harness = false
