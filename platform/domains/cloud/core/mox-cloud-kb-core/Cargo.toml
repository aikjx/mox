[package]
name = "mox-cloud-kb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MOX 云盘知识库核心：文档分块、向量索引、语义检索、重排序。RAG 系统的核心组件。"

[dependencies]
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 异步
async-trait = { workspace = true }
tokio = { workspace = true }

# 时间
chrono = { workspace = true, features = ["serde"] }

# UUID
uuid = { workspace = true, features = ["serde", "v4"] }

# 错误处理
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }

# 统一归一化契约
mox-unified-contract = { workspace = true }

# 并发原语（RwLock）
parking_lot = { workspace = true }

# 数学计算（余弦相似度等）
# 使用纯 Rust 实现，避免 nalgebra 依赖过重

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
mox-ai-alliance-engine = { workspace = true }
mox-unified-contract = { workspace = true }
mox-config-core = { workspace = true }
