[package]
name = "mox-cloud-s3-svc"
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mox - 最高权限璇玑"]
description = "Mox Cloud Drive S3 Compatible Service - 100% self-implemented (no third-party storage engines)"

[dependencies]
mox-cloud-foundation = { workspace = true }
mox-data-standards-core = { workspace = true }
mox-cloud-master-svc = { workspace = true }
mox-cloud-volume-svc = { workspace = true }
mox-cloud-store-core = { workspace = true }
mox-cloud-kernel = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xml-rs = "0.8"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
bytes = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
md-5 = "0.10"
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"

[features]
default = []
# Enables Glacier cold-layer adapters, 445 RESTORE status codes and the
# lifecycle HTTP handler extensions.
glacier = []
