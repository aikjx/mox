[package]
name = "mox-cloud-filer-svc"
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mox - 最高权限璇玑"]
description = "Mox Cloud Drive M3 POSIX Filer - 3 Meta backends (SQLite / Postgres+Citus / Redis mock) + self-dev FUSE client. No JuiceFS / S3FS / Goofys third-party POSIX gateway used — FUSE logic 100% Mox self-dev."

[lib]
path = "src/lib.rs"

[features]
default = ["rusqlite_backend"]
rusqlite_backend = ["dep:rusqlite"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
# 阶段2：桥接 store-core 真实后端（FS/S3 + 内容寻址去重）
mox-cloud-store-core = { workspace = true, features = ["s3"] }
mox-base-store-core = { workspace = true }
mox-cloud-domain-traits = { workspace = true }
mox-cloud-kernel = { workspace = true }
bytes = "1"
# 真实 Redis 客户端（替代原内存 mock）
redis = { workspace = true }

[dev-dependencies]
tempfile = "3"
