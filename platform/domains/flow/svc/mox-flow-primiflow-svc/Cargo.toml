[package]
name = "mox-flow-primiflow-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PrimiFlow 全域原语智能平台 · 关联图谱驱动的需求→代码/数据骨架生成层"

[dependencies]
mox-platform-foundation = { workspace = true }
mox-ai-flow-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
mox-platform-system-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# 默认不含 HTTP 服务层；需在构建示例/部署时显式开启 `--features server`。
# 这样核心库（被 primiflow-fusion 依赖）的默认构建不受 server 模块波动影响。
default = []
server = []

[dev-dependencies]
reqwest = { workspace = true }

[[example]]
name = "gen"
path = "examples/gen.rs"

[[example]]
name = "enterprise_demo"
path = "examples/enterprise_demo.rs"

[[example]]
name = "server_demo"
path = "examples/server_demo.rs"
required-features = ["server"]

# 注意：c_r10001-15.rs 和 generate.rs 是代码生成验收用例，
# 依赖 examples/out/ 目录中的生成文件（由 gen.rs 运行后生成）。
# 这些用例不纳入默认 example 构建，需先运行 gen 生成代码后单独验证。

[[test]]
name = "api_server"
required-features = ["server"]
