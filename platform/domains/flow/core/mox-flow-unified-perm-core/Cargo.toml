[package]
name = "mox-flow-unified-perm-core"
version = "0.1.0"
edition = "2021"
description = "璇玑 RelGraph · 统一权限核心 (Unified Permission Core) - RBAC+ABAC混合+多租户+数据权限+SSO"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
