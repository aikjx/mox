[package]
name = "mox-flow-unified-meta-core"
version = "0.1.0"
edition = "2021"
description = "统一元数据层 — 知识图谱与云盘元数据统一模型与分布式共识"
license = "MIT"

[dependencies]
mox-platform-foundation = { path = "../../../../foundation/mox-platform-foundation" }
mox-flow-unified-storage-core = { path = "../mox-flow-unified-storage-core" }
async-trait = "0.1"
parking_lot = "0.12"
indexmap = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.0"
