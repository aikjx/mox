[package]
name = "mox-platform-meta-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Mox - 最高权限璇玑"]
description = "MOX 平台元数据核心：实体/字段/行业/枚举定义仓库"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { workspace = true }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
once_cell = "1"
regex = "1.10"
parking_lot = "0.12"
