[package]
name = "mox-platform-iam-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Mox - 最高权限璇玑"]
description = "MOX 平台 IAM 核心：用户/租户/权限/审计日志"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { workspace = true }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "6"
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
parking_lot = "0.12"
