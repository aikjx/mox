[package]
name = "mox-kg-core"
version = "0.1.0"
edition = "2021"
description = "Mox Platform - 自研知识图谱核心引擎（Rust + RocksDB）"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "1"
hex = "0.4"
sha2 = "0.10"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
