[package]
name = "mox-platform-enterprise-svc"
version = "1.0.0"
edition = "2021"
description = "企业级 axum HTTP 真源服务：IAM + Meta + 通用 CRUD + 编排器"

[lib]
name = "enterprise_svc_lib"
path = "src/lib.rs"

[[bin]]
name = "enterprise-svc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
mox-framework = { path = "../../../../../framework" }
mox-platform-iam-core = { path = "../../core/mox-platform-iam-core" }
mox-platform-meta-core = { path = "../../core/mox-platform-meta-core" }
mox-platform-datastore-core = { path = "../../core/mox-platform-datastore-core" }
mox-platform-orchestrator-core = { path = "../../core/mox-platform-orchestrator-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["json", "multipart"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "timeout", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
