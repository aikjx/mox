[package]
name = "mox-platform-orchestrator-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "operator-server"
path = "src/main.rs"

[dependencies]
mox-api-protocol = { workspace = true }
mox-platform-foundation = { workspace = true }
mox-platform-module-core = { workspace = true }
mox-flow-operator-core = { workspace = true }
# Cross-domain capabilities this host still implements inline rather than consuming as a
# contract. /api/graph/* (17 endpoints, proxied by the gateway and targeted by AI intent
# routing) comes from the kg algorithm crate; /api/analyze/spiral comes from the data catalog
# and is called by the admin console; WASM plugin management backs the plugin centre page.
# Retiring these edges means proxying to the owning domain services, which depends on the
# four-domain independent deployment work, so they stay recorded as known debt instead of
# being relocated purely to lower this crate's fan-out.
mox-kg-algo-core = { workspace = true }
mox-flow-operator-wasm-svc = { workspace = true }
mox-flow-optimizer-core = { workspace = true }
mox-ai-agent-svc = { workspace = true }
mox-data-catalog-svc = { workspace = true }
mox-ai-expert-svc = { workspace = true }
mox-ai-flow-sdk = { workspace = true }
# 子服务聚合（Phase 1 收敛）：四套并行 server 以库方式挂载，由 runtime 唯一对外暴露。
# 各自 bin 保留为独立部署选项，生产统一走 operator-server。
mox-platform-system-core = { workspace = true }
mox-platform-meta-core = { workspace = true }
mox-flow-primiflow-svc = { workspace = true, features = ["server"] }
mox-flow-fusion-svc = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nalgebra = { workspace = true, features = ["serde-serialize"] }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
# No workspace service crate is declared here. Cross-crate contract constants are verified
# statically by tools/contract_meta_check.py, which keeps this crate's declared fan-out free
# of edges that exist only for testing.
tokio = { workspace = true }
reqwest = { workspace = true }

[features]
# 治理台 API（/api/governance/*）：挂载 OUS 前端治理台的全部 REST + WebSocket 端点。
# 默认启用，使治理台随运行时二进制一同编译与暴露。
default = ["governance"]
governance = []
