[package]
name = "mox-framework"
version = "1.0.0"
edition = "2021"
description = "mox 企业级基础框架：配置/日志/错误/健康/指标/追踪/认证/租户/弹性"
license = "MIT"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Web
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "timeout", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.24"
opentelemetry = { version = "0.24", features = ["trace"] }
metrics = "0.23"

# Error
thiserror = "1"
anyhow = "1"

# Config (Environment source is core, no feature needed)
config = { version = "0.14", features = ["yaml", "json", "toml"] }

# Auth
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
once_cell = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
