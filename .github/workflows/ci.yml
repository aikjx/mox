name: MOX CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  architecture:
    name: Architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment and port contracts
        run: |
          python -m unittest scripts.tests.test_deployment_architecture -v
          python scripts/gate/verify-ports.py
          # 脚本路径解析门禁（F33）：代码/CI 里写死的仓内脚本路径必须解析得到，
          # 迁移脱钩（scripts/x.py → scripts/gate/x.py 那类）未在册即阻断合并。
          python scripts/gate/check-script-paths.py --selftest
          python scripts/gate/check-script-paths.py

      - name: Verify API registry is up to date (gen + diff gate)
        run: |
          python scripts/doc/gen-api-registry.py
          git diff --exit-code -- docs/API-REGISTRY.md

  frontend-module:
    name: Frontend module governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run frontend module governance gates
        run: python scripts/gate/check-frontend-module.py
        # FE-MOD-GOV-V1.0 门禁：element-plus 根导入 / 跨目录相对导入 / barrel 冲突 /
        # api·store 命名 / epSubpathResolver 在位；任何 ERROR 阻断合并。

  # ===========================================================================
  # 1.0b 前端质量与治理探针（计划 P2：docs/architecture/API-SURFACE-AUTHORITY-PLAN-v0.1.md）
  #      此前 1,125 个 vitest 用例与 frontend-ui/scripts/gate/ 全部探针在 CI 里一处都没被引用，
  #      治理装置只在本地 check-all.ps1 里跑——本轮把它们接成独立 job（不塞进已有编号步骤）。
  #      未本机验证：pnpm install/test/build 三步本轮未在此窗口运行（有并发作者与在跑的服务进程），
  #      合并前请按方案 §二 P2 的判据本地预跑一遍。
  # ===========================================================================
  frontend-governance:
    name: Frontend quality + governance gates (vitest, build, probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不给 version：让 packageManager 里钉的 pnpm@11.15.1 生效

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-ui/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: frontend-ui
        run: pnpm install --frozen-lockfile

      - name: Unit tests (vitest run)
        working-directory: frontend-ui
        run: pnpm run test

      - name: Production build (rollup 才是消费者账的验针)
        working-directory: frontend-ui
        run: pnpm run build

      # 以下探针全部按仓根相对路径书写：scripts/gate/check-script-paths.py 会把 CI run 里
      # 写死的仓内路径拿去盘上解析，裸名或按 step working-directory 解不通的写法一律判红。

      - name: 时间/locale 口径门禁（AGENTS.md 自称 CI 门禁而此前未接）
        run: |
          python scripts/gate/check-locale-format-outlets.py --selftest
          python scripts/gate/check-locale-format-outlets.py

      - name: 前端治理探针（2026-09-30 本机实测 rc=0 的 5 枚）
        run: |
          python frontend-ui/scripts/gate/check-api-binding-kinds.py --check
          python frontend-ui/scripts/gate/check-ep-feedback-imports.py --check
          python frontend-ui/scripts/gate/check-framework-imports.py --check
          python frontend-ui/scripts/gate/check-theme-tokens.py --check
          node frontend-ui/scripts/gate/check-sfc-dead-refs.mjs --selftest

      - name: 企业功能需求与真实命令契约
        run: |
          python scripts/registry/enterprise_capabilities.py --check
          python -m unittest scripts.tests.test_enterprise_capabilities -v
          node --test frontend-ui/src/modules/message-center/contract/send.node-test.mjs frontend-ui/src/utils/api-key.node-test.mjs frontend-ui/src/utils/audit.node-test.mjs frontend-ui/src/modules/expert-alliance/contract/event-stream.node-test.mjs frontend-ui/src/modules/expert-alliance/contract/favorite-request.node-test.mjs frontend-ui/src/modules/expert-alliance/contract/favorite-journal.node-test.mjs

      - name: 核心公式识别器的牙（只验仪器自己有没有坏，不替维护者选字形口径）
        run: |
          # --selftest 判的是"这台仪器有针"：夹具L 把门禁自己源码里的每条红模板对上一枚内存对照
          # （红清单从源码 AST 现取，不写清单），夹具M 把"这台仪器有没有真接进 CI"钉成判决，
          # 夹具O 反向对账：名单来源换成 AGENTS.md 自己——凡是它标了「CI 门禁」又挂着脚本路径的行，
          # 逐条要求在某个 workflow 的真 run 命令里出现（挂不上路径的行只印行号，不冒充已核实）。
          # --ledger 单一算源与文档镜像那侧的对照住在 scripts/gate/check-api-surface.py 自己的电池里。
          # 例数一律不抄进这段说明——它只由各自 stdout 末行"SELFTEST 总 N 例，FAIL M 例"现印；
          # 抄一遍就是开第二个权威源：改一格判据它就静默腐烂，而没有任何针会为它红。
          # 本机实测 2026-10-02 16:37：check-doc-formulas --selftest rc=0（2.6 s），check-api-surface --selftest rc=0（0.8 s）。
          python scripts/gate/check-doc-formulas.py --selftest
          python scripts/gate/check-api-surface.py --selftest
          echo "NOT-WIRED scripts/gate/check-doc-formulas.py --census/--dircheck/--recognizer：裁决点 6（ASCII 等号族字形口径三选一）未裁，" \
               "接进去等于替维护者选定字形；覆盖面与分母由这三条模式自署，但不进 rc。识别器的集外边界读数见 --recognizer 判决行。"

      - name: 明示本轮未接线的门禁（拒绝用 continue-on-error 把盲区包装成绿）
        run: |
          echo "BLOCKED frontend-ui/scripts/gate/check-view-hex.py --check：本机实测 rc=1（grown=1 new=1 textasfill=33），存量债未清，接线即整仓 CI 红"
          echo "BLOCKED frontend-ui/scripts/gate/check-import-reach.mjs --selftest：本机实测 rc=1（stores/index.js 被判可达的形状）"
          echo "BLOCKED frontend-ui/scripts/gate/check-route-links.mjs --selftest：本机实测 rc=1（/alliance/console 在路由表出现 2 次）"
          echo "NOT-A-GATE 变异电池（framework-imports 与 view-hex 各自的 mutants 变体、scan_set/role_judgments 两支）与 view-hex 清算计划脚本：慢且非判决，不进 CI"

  # ===========================================================================
  # 1.1 Rust 架构门禁 + core 层特性矩阵（模块化 / 归一化守卫）
  #     - 层级依赖 / 跨域 API / 无环 / core 零 IO / 跨 crate 符号去重
  #     - core 默认零 IO（不启用任何适配层 feature）
  #     - 适配层 feature（llm-http）可独立编译并通过测试
  # ===========================================================================
  architecture-rust:
    name: Architecture gates (Rust) + core feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arch-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arch-

      - name: Architecture gates (layering / core IO / normalization)
        run: cargo test -p mox-arch-test --lib --verbose

      - name: Core default build must stay IO-free (zero-IO)
        run: cargo check -p mox-ai-alliance-engine --verbose

      - name: Core adapter feature `llm-http` compiles and passes tests
        run: cargo test -p mox-ai-alliance-engine --features llm-http

  # ===========================================================================
  # 1. 代码质量检查（fmt + clippy）
  # ===========================================================================
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ===========================================================================
  # 2. 核心 crate 编译检查
  # ===========================================================================
  build:
    name: Build (core crates)
    runs-on: ubuntu-latest
    needs: [lint, architecture]
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-server-runtime
          - mox-kb-core
          - mox-dsql-core
          - mox-platform-gateway-svc
          - mox-kg-server
          - mox-cloud-server
          - mox-iam-server
          - mox-kb-server
          - mox-alliance-registry-core
          - mox-alliance-registry-svc
          - mox-alliance-scheduler-core
          - mox-alliance-scheduler-svc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-build-

      - name: Install libclang (mox-kg-server 默认 persist-rocksdb，需 rocksdb FFI)
        if: matrix.crate == 'mox-kg-server'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Check ${{ matrix.crate }}
        run: cargo check -p ${{ matrix.crate }} --verbose

      - name: Verify fused and independent domain hosts
        if: matrix.crate == 'mox-platform-gateway-svc'
        run: |
          cargo build -p mox-platform-gateway-svc --bin mox-server
          python scripts/tests/verify_domain_hosts.py target/debug/mox-server
          cargo test -p mox-platform-gateway-svc --lib host_role_rejects_unknown_or_empty_values
          cargo test -p mox-platform-gateway-svc --lib external_callback_never_creates_a_mock_session
          cargo test -p mox-kb-svc document::tests

  # ===========================================================================
  # 3. 单元测试
  # ===========================================================================
  test:
    name: Test (unit tests)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-dsql-core
          - mox-server-runtime
          - mox-alliance-registry-core
          - mox-alliance-scheduler-core
          - mox-alliance-scheduler-svc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.crate }}-

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --lib --verbose

      # 调度器的多活实现（租约选主 + 共享任务库）落在 sqlite feature 上：
      # 默认 feature 编译不到 SqliteLeaseStore / SqliteTaskRepository，必须单独跑一轮。
      - name: Test alliance-scheduler-core with the sqlite backend
        if: matrix.crate == 'mox-alliance-scheduler-core'
        run: cargo test -p mox-alliance-scheduler-core --lib --features sqlite --verbose

      # svc 的多活装配与 HTTP 面都在集成测试里（oneshot，无需占端口）
      - name: Test alliance-scheduler-svc integration targets
        if: matrix.crate == 'mox-alliance-scheduler-svc'
        run: cargo test -p mox-alliance-scheduler-svc --tests --verbose

  # ===========================================================================
  # 4. Redis 后端特性编译
  # ===========================================================================
  build-redis:
    name: Build (redis-backend feature)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-redis-${{ hashFiles('**/Cargo.lock') }}

      - name: Check mox-cache-core with redis-backend
        run: cargo check -p mox-cache-core --features redis-backend --verbose

  # ===========================================================================
  # 4b. KG 海量规模回归（十万节点方案 §七 P0 验收）
  #     权威文档: docs/architecture/microservices/07-massive-scale-100k-nodes.md
  # ===========================================================================
  kg-scale:
    name: KG massive-scale gate (P0 持久化+回归锁定)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (persist-rocksdb 编译依赖)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kgscale-${{ hashFiles('**/Cargo.lock') }}

      - name: 内存引擎全套回归（计时断言要求单线程）
        run: cargo test -p mox-kg-storage-svc --release -- --test-threads=1

      - name: RocksDB 模式编译门禁（全部 cfg 分支 + 持久化测试可编译）
        run: cargo check -p mox-kg-storage-svc --release --features persist-rocksdb --all-targets

      - name: RocksDB 持久化闭环（跨重启读回 + 长 VID，默认 ack 前 fsync）
        run: cargo test -p mox-kg-storage-svc --release --features persist-rocksdb --test t_persistence_rocksdb -- --test-threads=1

      - name: RocksDB 模式正确性子集（分裂守恒/分片/集成，异步 WAL 性能档）
        env:
          MOX_KG_WAL_SYNC: "0"
        run: >
          cargo test -p mox-kg-storage-svc --release --features persist-rocksdb
          --test t_distributed_sharding --test t_integration_storage --test t_integration_query
          -- --test-threads=1

      - name: 容量模型复算
        run: python3 tools/scale-model/capacity_model.py

      - name: 上传容量证据
        uses: actions/upload-artifact@v4
        with:
          name: capacity-model-100k
          path: reports/data/*capacity-model-100k*.json
          if-no-files-found: error

  # ===========================================================================
  # 5. Docker 镜像构建（仅 main 分支）
  # ===========================================================================
  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        service:
          - name: mox-server
            package: mox-platform-gateway-svc
            port: 3080
          - name: mox-kg-server
            package: mox-kg-server
            port: 3411
          - name: mox-cloud-server
            package: mox-cloud-server
            port: 3412
          - name: mox-iam-server
            package: mox-iam-server
            port: 3413
          - name: mox-kb-server
            package: mox-kb-server
            port: 3414
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.rust-service
          build-args: |
            PACKAGE=${{ matrix.service.package }}
            BINARY=${{ matrix.service.name }}
            PORT=${{ matrix.service.port }}
          push: false
          tags: ${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
