name: MOX CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # 1. 代码质量检查（fmt + clippy）
  # ===========================================================================
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ===========================================================================
  # 2. 核心 crate 编译检查
  # ===========================================================================
  build:
    name: Build (core crates)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-server-runtime
          - mox-kb-core
          - mox-dsql-core
          - mox-kg-server
          - mox-cloud-server
          - mox-iam-server
          - mox-kb-server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-build-

      - name: Check ${{ matrix.crate }}
        run: cargo check -p ${{ matrix.crate }} --verbose

  # ===========================================================================
  # 3. 单元测试
  # ===========================================================================
  test:
    name: Test (unit tests)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-dsql-core
          - mox-server-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.crate }}-

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --lib --verbose

  # ===========================================================================
  # 4. Redis 后端特性编译
  # ===========================================================================
  build-redis:
    name: Build (redis-backend feature)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-redis-${{ hashFiles('**/Cargo.lock') }}

      - name: Check mox-cache-core with redis-backend
        run: cargo check -p mox-cache-core --features redis-backend --verbose

  # ===========================================================================
  # 5. Docker 镜像构建（仅 main 分支）
  # ===========================================================================
  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        service:
          - name: mox-kg-server
            port: 8101
            dockerfile: platform/domains/kg/svc/mox-kg-server/Dockerfile
          - name: mox-cloud-server
            port: 8102
            dockerfile: platform/domains/cloud/svc/mox-cloud-server/Dockerfile
          - name: mox-iam-server
            port: 8103
            dockerfile: platform/domains/platform/svc/mox-iam-server/Dockerfile
          - name: mox-kb-server
            port: 8104
            dockerfile: platform/domains/kb/svc/mox-kb-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          build-args: SERVICE=${{ matrix.service.name }}
          push: false
          tags: ${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
