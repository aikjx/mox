name: MOX CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  architecture:
    name: Architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment and port contracts
        run: |
          python -m unittest scripts.tests.test_deployment_architecture -v
          python scripts/verify-ports.py

      - name: Verify API registry is up to date (gen + diff gate)
        run: |
          python scripts/gen-api-registry.py
          git diff --exit-code -- docs/API-REGISTRY.md

  # ===========================================================================
  # 1.1 Rust 架构门禁 + core 层特性矩阵（模块化 / 归一化守卫）
  #     - 层级依赖 / 跨域 API / 无环 / core 零 IO / 跨 crate 符号去重
  #     - core 默认零 IO（不启用任何适配层 feature）
  #     - 适配层 feature（llm-http）可独立编译并通过测试
  # ===========================================================================
  architecture-rust:
    name: Architecture gates (Rust) + core feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arch-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arch-

      - name: Architecture gates (layering / core IO / normalization)
        run: cargo test -p mox-arch-test --lib --verbose

      - name: Core default build must stay IO-free (zero-IO)
        run: cargo check -p mox-ai-alliance-engine --verbose

      - name: Core adapter feature `llm-http` compiles and passes tests
        run: cargo test -p mox-ai-alliance-engine --features llm-http

  # ===========================================================================
  # 1. 代码质量检查（fmt + clippy）
  # ===========================================================================
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ===========================================================================
  # 2. 核心 crate 编译检查
  # ===========================================================================
  build:
    name: Build (core crates)
    runs-on: ubuntu-latest
    needs: [lint, architecture]
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-server-runtime
          - mox-kb-core
          - mox-dsql-core
          - mox-platform-gateway-svc
          - mox-kg-server
          - mox-cloud-server
          - mox-iam-server
          - mox-kb-server
          - mox-alliance-registry-core
          - mox-alliance-registry-svc
          - mox-alliance-scheduler-core
          - mox-alliance-scheduler-svc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-build-

      - name: Install libclang (mox-kg-server 默认 persist-rocksdb，需 rocksdb FFI)
        if: matrix.crate == 'mox-kg-server'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Check ${{ matrix.crate }}
        run: cargo check -p ${{ matrix.crate }} --verbose

      - name: Verify fused and independent domain hosts
        if: matrix.crate == 'mox-platform-gateway-svc'
        run: |
          cargo build -p mox-platform-gateway-svc --bin mox-server
          python scripts/tests/verify_domain_hosts.py target/debug/mox-server
          cargo test -p mox-platform-gateway-svc --lib host_role_rejects_unknown_or_empty_values
          cargo test -p mox-platform-gateway-svc --lib external_callback_never_creates_a_mock_session
          cargo test -p mox-kb-svc document::tests

  # ===========================================================================
  # 3. 单元测试
  # ===========================================================================
  test:
    name: Test (unit tests)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        crate:
          - mox-cache-core
          - mox-dsql-core
          - mox-server-runtime
          - mox-alliance-registry-core
          - mox-alliance-scheduler-core
          - mox-alliance-scheduler-svc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.crate }}-

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --lib --verbose

      # 调度器的多活实现（租约选主 + 共享任务库）落在 sqlite feature 上：
      # 默认 feature 编译不到 SqliteLeaseStore / SqliteTaskRepository，必须单独跑一轮。
      - name: Test alliance-scheduler-core with the sqlite backend
        if: matrix.crate == 'mox-alliance-scheduler-core'
        run: cargo test -p mox-alliance-scheduler-core --lib --features sqlite --verbose

      # svc 的多活装配与 HTTP 面都在集成测试里（oneshot，无需占端口）
      - name: Test alliance-scheduler-svc integration targets
        if: matrix.crate == 'mox-alliance-scheduler-svc'
        run: cargo test -p mox-alliance-scheduler-svc --tests --verbose

  # ===========================================================================
  # 4. Redis 后端特性编译
  # ===========================================================================
  build-redis:
    name: Build (redis-backend feature)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-redis-${{ hashFiles('**/Cargo.lock') }}

      - name: Check mox-cache-core with redis-backend
        run: cargo check -p mox-cache-core --features redis-backend --verbose

  # ===========================================================================
  # 4b. KG 海量规模回归（十万节点方案 §七 P0 验收）
  #     权威文档: docs/architecture/microservices/07-massive-scale-100k-nodes.md
  # ===========================================================================
  kg-scale:
    name: KG massive-scale gate (P0 持久化+回归锁定)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (persist-rocksdb 编译依赖)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kgscale-${{ hashFiles('**/Cargo.lock') }}

      - name: 内存引擎全套回归（计时断言要求单线程）
        run: cargo test -p mox-kg-storage-svc --release -- --test-threads=1

      - name: RocksDB 模式编译门禁（全部 cfg 分支 + 持久化测试可编译）
        run: cargo check -p mox-kg-storage-svc --release --features persist-rocksdb --all-targets

      - name: RocksDB 持久化闭环（跨重启读回 + 长 VID，默认 ack 前 fsync）
        run: cargo test -p mox-kg-storage-svc --release --features persist-rocksdb --test t_persistence_rocksdb -- --test-threads=1

      - name: RocksDB 模式正确性子集（分裂守恒/分片/集成，异步 WAL 性能档）
        env:
          MOX_KG_WAL_SYNC: "0"
        run: >
          cargo test -p mox-kg-storage-svc --release --features persist-rocksdb
          --test t_distributed_sharding --test t_integration_storage --test t_integration_query
          -- --test-threads=1

      - name: 容量模型复算
        run: python3 tools/scale-model/capacity_model.py

      - name: 上传容量证据
        uses: actions/upload-artifact@v4
        with:
          name: capacity-model-100k
          path: reports/data/*capacity-model-100k*.json
          if-no-files-found: error

  # ===========================================================================
  # 5. Docker 镜像构建（仅 main 分支）
  # ===========================================================================
  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        service:
          - name: mox-server
            package: mox-platform-gateway-svc
            port: 3080
          - name: mox-kg-server
            package: mox-kg-server
            port: 3411
          - name: mox-cloud-server
            package: mox-cloud-server
            port: 3412
          - name: mox-iam-server
            package: mox-iam-server
            port: 3413
          - name: mox-kb-server
            package: mox-kb-server
            port: 3414
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.rust-service
          build-args: |
            PACKAGE=${{ matrix.service.package }}
            BINARY=${{ matrix.service.name }}
            PORT=${{ matrix.service.port }}
          push: false
          tags: ${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
