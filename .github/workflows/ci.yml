# =============================================================================
# MOX 平台 - CI/CD 流水线
# =============================================================================
# 触发条件：
#   - PR 到 main/master/develop 分支
#   - 直接 push 到 main/master/develop 分支
#
# 流水线阶段：
#   1. Check & Lint   - cargo check + rustfmt + clippy
#   2. Test (matrix)  - 核心 crate 单元测试
#   3. Build          - workspace 构建验证
#   4. Frontend       - 前端 lint + test + build
# =============================================================================

name: MOX CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'platform/**'
      - 'frontend-ui/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'platform/**'
      - 'frontend-ui/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  # ===========================================================================
  # 阶段 1: Rust 检查 & Lint
  # ===========================================================================
  rust-check:
    name: Rust Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-build-

      - name: cargo check (default members)
        run: cargo check --workspace

      - name: rustfmt check
        run: cargo fmt --workspace --all-targets -- --check

      - name: clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===========================================================================
  # 阶段 2: Rust 测试（矩阵并行）
  # ===========================================================================
  rust-test:
    name: Test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    needs: rust-check

    strategy:
      fail-fast: false
      matrix:
        crate:
          # Foundation 层
          - mox-error
          - mox-framework
          # Core 层
          - mox-kg-algo-core
          - mox-kg-core
          - mox-flow-operator-core
          - mox-ai-intent-core
          - mox-data-standards-core
          - mox-data-norm-core
          - mox-data-formula-core
          - mox-voice-dsp-core
          - mox-platform-operator-core
          - mox-platform-system-core
          - mox-platform-iam-core
          - mox-platform-meta-core
          - mox-dsql-core
          # Service 层
          - mox-kg-service-svc
          - mox-project-graph-core
          - mox-project-graph-svc
          - mox-voice-core-svc
          - mox-voice-asr-svc
          - mox-voice-intent-svc
          - mox-voice-operator-svc
          - mox-market-template-svc
          - mox-data-catalog-svc
          # Gateway
          - mox-platform-gateway-svc
          # API 层
          - mox-voice-api
          - mox-market-api
          # SDK
          - mox-cloud-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-build-

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --no-fail-fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.crate }}
          path: target/test-results/
          if-no-files-found: ignore

  # ===========================================================================
  # 阶段 3: Rust 构建验证
  # ===========================================================================
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    needs: rust-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-check-

      - name: Build workspace (debug)
        run: cargo build --workspace

      - name: Build gateway (release)
        run: cargo build --release -p mox-platform-gateway-svc

      - name: Upload gateway binary
        uses: actions/upload-artifact@v4
        with:
          name: mox-gateway-binary
          path: target/release/mox-platform-gateway-svc
          if-no-files-found: ignore

  # ===========================================================================
  # 阶段 4: 前端检查
  # ===========================================================================
  frontend:
    name: Frontend Lint & Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

  # ===========================================================================
  # 汇总状态（PR 合并检查点）
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-check, rust-test, rust-build, frontend]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          echo "Rust Check & Lint: ${{ needs.rust-check.result }}"
          echo "Rust Test (matrix): ${{ needs.rust-test.result }}"
          echo "Rust Build: ${{ needs.rust-build.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"

          if [[ "${{ needs.rust-check.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ CI FAILED"
            exit 1
          fi

          echo "✅ All CI checks passed!"
