# =============================================================================
# MOX 平台 - CI/CD 流水线
# =============================================================================
# 触发条件：
#   - PR 到 main/master 分支
#   - 直接 push 到 main/master 分支
#   - 打 tag v* 时触发 release
#
# 流水线阶段：
#   1. Checkout & Setup  - 检出代码，准备环境
#   2. Lint & Format     - 代码规范检查
#   3. Test              - 单元测试 + 集成测试
#   4. Build             - 构建验证
#   5. Docs              - API 文档生成
# =============================================================================

name: MOX CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'platform/**'
      - 'frontend-ui/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'platform/**'
      - 'frontend-ui/**'
      - '.github/workflows/**'
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ===========================================================================
  # 阶段 1: Rust 代码检查
  # ===========================================================================
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting (rustfmt)
        run: cargo fmt --workspace --all-targets -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===========================================================================
  # 阶段 2: Rust 测试
  # ===========================================================================
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    needs: rust-lint

    strategy:
      matrix:
        crate:
          - mox-error
          - mox-kg-algo-core
          - mox-flow-operator-core
          - mox-ai-intent-core
          - mox-data-standards-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-test-

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }} --no-fail-fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.crate }}
          path: target/test-results/
          if-no-files-found: ignore

  # ===========================================================================
  # 阶段 3: Rust 构建验证
  # ===========================================================================
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    needs: rust-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build (debug)
        run: cargo build --workspace

      - name: Build (release) - gateway only
        run: cargo build --release -p mox-platform-gateway-svc

  # ===========================================================================
  # 阶段 4: 前端检查
  # ===========================================================================
  frontend-lint:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Type check (if available)
        run: npx vue-tsc --noEmit || echo "Type check skipped (no vue-tsc config)"

      - name: Build
        run: npm run build

  # ===========================================================================
  # 阶段 5: API 文档生成
  # ===========================================================================
  api-docs:
    name: API Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    needs: rust-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Generate rust docs
        run: cargo doc --workspace --no-deps

      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/target/doc

  # ===========================================================================
  # 汇总状态（用于 PR 合并检查）
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, rust-build, frontend-lint]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "Rust Lint: ${{ needs.rust-lint.result }}"
          echo "Rust Test: ${{ needs.rust-test.result }}"
          echo "Rust Build: ${{ needs.rust-build.result }}"
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          
          if [[ "${{ needs.rust-lint.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          
          echo "✅ All CI checks passed!"
