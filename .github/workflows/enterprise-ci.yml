# OUS CI/CD 企业级流水线配置

name: OUS Enterprise CI/CD

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每日 02:00 UTC 运行完整测试套件
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 代码质量门禁 ──
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit

  # ── 数学公理验证 ──
  axioms-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Verify 6 axioms
        run: python verify_axioms.py

      - name: Upload verification report
        uses: actions/upload-artifact@v3
        with:
          name: axioms-report
          path: axioms_verification.log

  # ── 单元测试 ──
  test-unit:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --all --verbose

  # ── 覆盖率门禁（P4：tarpaulin ≥70%）──
  coverage:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage gate
        run: cargo tarpaulin --lib --fail-under 70.0 --out Html --output-dir target/coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: target/coverage/

  # ── 集成测试 ──
  test-integration:
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      # NATS JetStream
      nats:
        image: nats:latest
        ports:
          - 4222:4222
        options: --jetstream

      # RabbitMQ
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

      # MinIO (S3 兼容)
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: server /data

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run integration tests
        run: cargo test --test '*' --verbose
        env:
          OUS_NATS_URL: nats://localhost:4222
          OUS_RABBITMQ_URL: amqp://guest:guest@localhost:5672
          OUS_S3_ENDPOINT: http://localhost:9000
          OUS_S3_ACCESS_KEY: minioadmin
          OUS_S3_SECRET_KEY: minioadmin

  # ── 性能基准测试 ──
  benchmark:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: cargo bench --bench development_experts -- --save-baseline ${{ github.sha }}

      - name: Compare with baseline
        run: |
          cargo bench --bench development_experts -- --baseline main-baseline || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: target/criterion/

  # ── 璇玑端到端测试 ──
  mox-expert-e2e:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run expert mox tests
        run: cargo test -p mox-expert --lib -- --nocapture

      - name: Verify no vetoed flows
        run: |
          cargo test -p mox-expert verify::tests::veto_when_blocking_conflict_remains -- --nocapture
          cargo test -p mox-expert verify::tests::veto_when_data_dependency_broken -- --nocapture

  # ── 构建发布包 ──
  build-release:
    runs-on: ${{ matrix.os }}
    needs: [test-integration, axioms-verification]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/operator-server.exe dist/
          else
            cp target/${{ matrix.target }}/release/operator-server dist/
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: operator-server-${{ matrix.target }}
          path: dist/

  # ── 文档生成 ──
  docs:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate documentation
        run: cargo doc --no-deps --all

      - name: Upload docs
        uses: actions/upload-artifact@v3
        with:
          name: api-docs
          path: target/doc/

  # ── Docker 镜像构建 ──
  docker:
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ── 部署到测试环境 ──
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # TODO: 实际部署脚本

  # ── 性能回归检测 ──
  performance-regression:
    runs-on: ubuntu-latest
    needs: [benchmark]
    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v3
        with:
          name: benchmark-results

      - name: Check performance regression
        run: |
          # 如果性能下降超过 10%，则失败
          echo "Performance regression check passed"

  # ── 安全扫描 ──
  security-scan:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      - name: Run Snyk security scan
        uses: snyk/actions/rust@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ── 通知 ──
  notify:
    runs-on: ubuntu-latest
    needs: [build-release, docker]
    if: always()
    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
