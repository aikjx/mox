[package]
name = "xuanji-expert"
version = "0.1.0"
edition = "2021"
description = "璇玑 · 全维处理工具流程图：七位专家并行诊断 + 归一化裁决 + 企业治理，复用 flow-ai 引擎做最优求解"
license = "MIT"

[dependencies]
flow-ai = { path = "../flow-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
http = "1"
hostname = "0.3"
tracing = "0.1"
# S3 审计后端：真实 HTTP(S) 上传（SigV4 签名手写，见 audit/s3.rs）
reqwest = { version = "0.12", features = ["json", "blocking"] }
