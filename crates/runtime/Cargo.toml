[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "operator-server"
path = "src/main.rs"

[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../operator-core" }
graph-algorithms = { path = "../graph-algorithms" }
operator-wasm = { path = "../operator-wasm" }
optimizer = { path = "../optimizer" }
ai-agent = { path = "../ai-agent" }
business-catalog = { path = "../business-catalog" }
xuanji-expert = { path = "../xuanji-expert" }
flow-ai = { path = "../flow-ai" }
# 子服务聚合（Phase 1 收敛）：四套并行 server 以库方式挂载，由 runtime 唯一对外暴露。
# 各自 bin 保留为独立部署选项，生产统一走 operator-server。
xuanji-system = { path = "../xuanji-system" }
primiflow-core = { path = "../primiflow-core", features = ["server"] }
primiflow-fusion = { path = "../primiflow-fusion" }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = { workspace = true }
parking_lot = "0.12"
async-trait = "0.1"
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

[features]
# 治理台 API（/api/governance/*）：挂载 OUS 前端治理台的全部 REST + WebSocket 端点。
# 默认启用，使治理台随运行时二进制一同编译与暴露。
default = ["governance"]
governance = []
