[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "operator-server"
path = "src/main.rs"

[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../operator-core" }
operator-graph = { path = "../operator-graph" }
operator-wasm = { path = "../operator-wasm" }
optimizer = { path = "../optimizer" }
ai-agent = { path = "../ai-agent" }
business-catalog = { path = "../business-catalog" }
expert-alliance = { path = "../expert-alliance" }
flow-ai = { path = "../flow-ai" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
