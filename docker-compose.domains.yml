# Same image and API in both modes. Select exactly one profile.
name: mox-domains
x-host: &host
  image: mox-domain-host:local
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.rust-service
    args:
      PACKAGE: mox-platform-gateway-svc
      BINARY: mox-server
      PORT: 3080
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
x-env: &env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong secret shared by the domain hosts}
  MOX_GATEWAY_HOST: 0.0.0.0
  MOX_GATEWAY_PORT: 3080
  MOX_DEV_MODE: "0"
services:
  fused:
    <<: *host
    profiles: [fused]
    environment:
      <<: *env
      MOX_HOST_ROLE: all
    ports: ["3080:3080"]
    volumes: ["fused-data:/app/data"]
  entry:
    image: nginx:1.27-alpine
    profiles: [split]
    ports: ["3080:3080"]
    volumes: ["./deploy/nginx/domains.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      kg: {condition: service_healthy}
      cloud: {condition: service_healthy}
      kb: {condition: service_healthy}
      iam: {condition: service_healthy}
  kg:
    <<: *host
    profiles: [split]
    environment:
      <<: *env
      MOX_HOST_ROLE: kg
      MOX_GATEWAY_PORT: 3411
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3411/health"]
    ports: ["127.0.0.1:3411:3411"]
    volumes: ["kg-data:/app/data"]
  cloud:
    <<: *host
    profiles: [split]
    environment:
      <<: *env
      MOX_HOST_ROLE: cloud
      MOX_GATEWAY_PORT: 3412
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3412/health"]
    ports: ["127.0.0.1:3412:3412"]
    volumes: ["cloud-data:/app/data"]
  kb:
    <<: *host
    profiles: [split]
    environment:
      <<: *env
      MOX_HOST_ROLE: kb
      MOX_GATEWAY_PORT: 3414
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3414/health"]
    ports: ["127.0.0.1:3414:3414"]
    volumes: ["kb-data:/app/data"]
  iam:
    <<: *host
    profiles: [split]
    environment:
      <<: *env
      MOX_HOST_ROLE: iam
      MOX_GATEWAY_PORT: 3413
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3413/health"]
    ports: ["127.0.0.1:3413:3413"]
    volumes: ["iam-data:/app/data"]
volumes:
  fused-data:
  kg-data:
  cloud-data:
  kb-data:
  iam-data:
