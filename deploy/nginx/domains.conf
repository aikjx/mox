server {
    listen 3080;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    # Keep URI, query, Authorization and cookies intact. Each host verifies JWT.
    location ~ ^/(kg/v1|graph/v1|ai/engine)(/|$) { proxy_pass http://kg:3411; }
    location ~ ^/cloud/v1(/|$) { proxy_pass http://cloud:3412; }
    location ~ ^/api/kb(/|$) { proxy_pass http://kb:3414; }
    location ~ ^/(api/(auth|tenant|system|security)|rbac/v1|api/enterprise/sso)(/|$) { proxy_pass http://iam:3413; }
    location = /health { default_type application/json; return 200 '{"ok":true,"component":"entry"}'; }
    # Unknown routes never fall back to another independent data owner.
    location / { return 404; }
}
