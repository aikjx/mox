# MOX v3.1 Kubernetes 部署清单
# 包含：4个微服务 + Redis + ConfigMap + Namespace

apiVersion: v1
kind: Namespace
metadata:
  name: mox
  labels:
    app.kubernetes.io/part-of: mox-platform
---
# ConfigMap: 通用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-common-config
  namespace: mox
data:
  RUST_LOG: "info"
  REDIS_URL: "redis://redis:6379"
  CACHE_BACKEND: "redis"
  TRACING_SAMPLE_RATE: "0.1"
---
# ConfigMap: KG服务配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-kg-config
  namespace: mox
data:
  SERVER_PORT: "8101"
  SERVER_HOST: "0.0.0.0"
  RATE_LIMIT_QPS: "1000"
  RATE_LIMIT_BURST: "200"
---
# ConfigMap: Cloud服务配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-cloud-config
  namespace: mox
data:
  SERVER_PORT: "8102"
  SERVER_HOST: "0.0.0.0"
  RATE_LIMIT_QPS: "500"
  RATE_LIMIT_BURST: "100"
---
# ConfigMap: IAM服务配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-iam-config
  namespace: mox
data:
  SERVER_PORT: "8103"
  SERVER_HOST: "0.0.0.0"
  RATE_LIMIT_QPS: "200"
  RATE_LIMIT_BURST: "50"
  JWT_EXPIRE_SECONDS: "3600"
  JWT_REFRESH_EXPIRE_SECONDS: "604800"
---
# ConfigMap: KB服务配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-kb-config
  namespace: mox
data:
  SERVER_PORT: "8104"
  SERVER_HOST: "0.0.0.0"
  RATE_LIMIT_QPS: "300"
  RATE_LIMIT_BURST: "60"
---
# Deployment: Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mox
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service: Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mox
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
# Deployment: mox-kg-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mox-kg-server
  namespace: mox
  labels:
    app: mox-kg-server
    version: v3.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mox-kg-server
  template:
    metadata:
      labels:
        app: mox-kg-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8101"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: mox-kg-server
        image: mox-kg-server:v3.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8101
        envFrom:
        - configMapRef:
            name: mox-common-config
        - configMapRef:
            name: mox-kg-config
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8101
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8101
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
# Service: mox-kg-server
apiVersion: v1
kind: Service
metadata:
  name: mox-kg-server
  namespace: mox
  labels:
    app: mox-kg-server
spec:
  selector:
    app: mox-kg-server
  ports:
  - name: http
    port: 8101
    targetPort: 8101
  type: ClusterIP
---
