---
# Ingress: 统一入口
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mox-ingress
  namespace: mox
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
  - host: mox.local
    http:
      paths:
      - path: /kg
        pathType: Prefix
        backend:
          service:
            name: mox-kg-server
            port:
              number: 8101
      - path: /cloud
        pathType: Prefix
        backend:
          service:
            name: mox-cloud-server
            port:
              number: 8102
      - path: /iam
        pathType: Prefix
        backend:
          service:
            name: mox-iam-server
            port:
              number: 8103
      - path: /kb
        pathType: Prefix
        backend:
          service:
            name: mox-kb-server
            port:
              number: 8104
---
# HorizontalPodAutoscaler: 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mox-kg-hpa
  namespace: mox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mox-kg-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# PodDisruptionBudget: 保证可用性
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mox-pdb
  namespace: mox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: mox-platform
