# MOX Kubernetes 默认部署：模块化网关单入口。
# KG、KB、Cloud、IAM 已编译进 mox-server；独立域服务仅用于可选扩展验证。

apiVersion: v1
kind: Namespace
metadata:
  name: mox
  labels:
    app.kubernetes.io/part-of: mox-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mox-gateway-config
  namespace: mox
data:
  RUST_LOG: "info"
  MOX_GATEWAY_HOST: "0.0.0.0"
  MOX_GATEWAY_PORT: "3080"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mox-gateway-data
  namespace: mox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mox-gateway
  namespace: mox
  labels:
    app.kubernetes.io/name: mox-gateway
    app.kubernetes.io/part-of: mox-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mox-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mox-gateway
        app.kubernetes.io/part-of: mox-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mox-gateway
          image: mox-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3080
          envFrom:
            - configMapRef:
                name: mox-gateway-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mox-gateway-secret
                  key: jwt-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mox-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: mox-gateway
  namespace: mox
  labels:
    app.kubernetes.io/name: mox-gateway
    app.kubernetes.io/part-of: mox-platform
spec:
  selector:
    app.kubernetes.io/name: mox-gateway
  ports:
    - name: http
      port: 3080
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mox-ingress
  namespace: mox
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: mox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mox-gateway
                port:
                  number: 3080
