# Default values for xuanji umbrella chart (一键伞图).

global:
  # 全局灰度发布开关
  gray:
    enabled: false
    # 灰度阶段：1% -> 10% -> 50% -> 100%
    stages:
      - 1
      - 10
      - 50
      - 100
    # 每阶段等待秒数（warmup 间隔）
    warmupSeconds: 300
    # 健康检查阈值：低于此百分比自动回滚
    healthThresholdPercent: 95
    # 灰度路由基于 header 或 cookie
    routeBy:
      header: "X-Xuanji-Gray"
      cookie: "xuanji_gray"

  # 全局镜像仓库
  imageRegistry: registry.infotopograph.io
  imagePullSecrets: []

  # 全局存储类
  storageClass: "xuanji-sc"

  # 全局服务暴露
  ingress:
    enabled: false
    className: "nginx"
    domain: xuanji.local

# xuanji-dr sub-chart values
xuanji-dr:
  enabled: true
  primaryRegion: cn-north-1
  failoverRegion: cn-south-1
  replicaCount: 2

# xuanji-core (alias: xuanji-core-local) sub-chart values
xuanji-core-local:
  enabled: true
  replicaCount: 3
  image:
    repository: xuanji/graph-core
    tag: "3.0.0"

# xuanji-observability sub-chart values
xuanji-observability:
  enabled: true
  grafana:
    adminPassword: "changeme"
  prometheus:
    retention: "30d"
  tracing:
    backend: "otlp"
    samplingRate: 1.0

# Canary release 配置
canary:
  enabled: false
  image:
    tag: "canary"
  weight: 1
  analysis:
    intervalSeconds: 60
    maxFailed: 1
    iterations: 5

# 资源配额全局默认
resourcesDefaults:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 1
    memory: 2Gi

# 命名空间配置
namespace:
  create: true
  name: "xuanji-system"

# RBAC
rbac:
  create: true

# 网络策略
networkPolicy:
  enabled: false
  ingressFrom: []
  egressTo: []

# ---------------------------------------------------------------------------
# T24-6 Kind 3 主 3 从企业级部署配置开关
# ---------------------------------------------------------------------------
# 启用后会渲染 templates/kind-3m3s-deployment.yaml：
#   - 3 master (control-plane) 节点：host etcd StatefulSet (replicas=3)
#   - 3 worker 节点：host xuanji-server Deployment (replicas=3，PodAntiAffinity hostname)
#   - 3 worker 节点：host MinIO Erasure Set 3 节点 (StatefulSet replicas=3)
#   - xuanji-server 仅部署在 worker (control-plane 污点过滤)；etcd 仅部署在 master
kind3m3s:
  enabled: false
  namespace: "xuanji-system"

  # xuanji-server 镜像与参数
  server:
    image: "registry.cn-hangzhou.aliyuncs.com/xuanji/server:v2.1"
    pullPolicy: "IfNotPresent"
    logLevel: "info"

  # SM2 根 CA 注入（生产请用 KMS/HSM；此处为 Kind 本地部署方便）
  sm2:
    # base64 of 32-byte SM2 private key
    sk32_b64: ""
    # base64 of 65-byte SM2 public key uncompressed
    pk65_b64: ""
    issuer_id_b64: "eHVhbmppLXNtMi1yb290" # default: "xuanji-sm2-root"

  # etcd (部署在 master 节点)
  etcd:
    image: "quay.io/coreos/etcd:v3.5.12"
    size: "10Gi"
    storageClass: "standard"

  # MinIO (部署在 worker 节点)
  minio:
    image: "quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z"
    size: "200Gi"
    storageClass: "standard"
    # default admin/admin → MUST override for prod: base64 of access/secret keys
    accessKeyB64: "eHVhbmppYWRtaW4="
    secretKeyB64: "eHVhbmppU2VjcmV0UGFzczEyMyE="

  # Ingress
  ingress:
    host: "xuanji.localhost"
