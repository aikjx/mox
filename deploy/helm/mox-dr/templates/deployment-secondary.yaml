apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mox-dr.fullname" . }}-secondary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mox-dr.labels" . | nindent 4 }}
    app.kubernetes.io/role: secondary
    dr.mox.io/region: {{ .Values.failoverRegion }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mox-dr.secondarySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mox-dr.secondarySelectorLabels" . | nindent 8 }}
        dr.mox.io/role: secondary
        dr.mox.io/region: {{ .Values.failoverRegion }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mox-dr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/role
                    operator: In
                    values:
                      - secondary
              topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - {{ .Values.failoverRegion }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: mox
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REGION
              value: secondary
            - name: MOX_REGION
              value: {{ .Values.failoverRegion }}
            - name: MOX_ROLE
              value: secondary
            - name: MOX_DR_ENABLED
              value: {{ .Values.dr.enabled | quote }}
            - name: MOX_PRIMARY_REGION
              value: {{ .Values.primaryRegion }}
            - name: MOX_REPLICATION_MODE
              value: {{ .Values.dr.replicationMode }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: graph
              containerPort: 7687
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: raft
              containerPort: 8200
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: mox-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: mox-data
          persistentVolumeClaim:
            claimName: {{ include "mox-dr.fullname" . }}-secondary
      {{- end }}
      {{- with .Values.nodeSelectorRegions.secondary }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
