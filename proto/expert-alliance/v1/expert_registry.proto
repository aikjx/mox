// ============================================================
// Expert Alliance v3 — 专家注册服务 (expert_registry.proto)
// 服务名: ExpertRegistryService
// 职责: 专家 CRUD / 定义验证 / 健康检查 / 工具自动发现
// 对应 Rust: alliance/team.rs (build_expert_registry) + Node expert-repository.js
// 14 维专家注册表外部化，支持动态注册与健康心跳
// ============================================================

syntax = "proto3";

package expert_alliance.v1;

import "expert-alliance/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "expert-alliance/v1;v1";

// ──────────────────────────────────────────────
// 注册服务
// ──────────────────────────────────────────────
service ExpertRegistryService {
  // 注册专家 — 含 3 项定义验证（工具存在/能力完整/命名冲突）
  rpc RegisterExpert(RegisterExpertRequest) returns (Expert);

  // 获取专家
  rpc GetExpert(GetExpertRequest) returns (Expert);

  // 列出专家（分页 + 维度/能力过滤）
  rpc ListExperts(ListExpertsRequest) returns (ListExpertsResponse);

  // 更新专家
  rpc UpdateExpert(UpdateExpertRequest) returns (Expert);

  // 删除专家
  rpc DeleteExpert(DeleteExpertRequest) returns (DeleteExpertResponse);

  // 健康心跳 — 专家定期上报健康状态
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // 工具自动发现 — 扫描 gRPC 反射生成 Tool 定义
  rpc DiscoverTools(DiscoverToolsRequest) returns (DiscoverToolsResponse);

  // 验证专家定义 — 3 项校验
  rpc ValidateExpert(ValidateExpertRequest) returns (ValidateExpertResponse);

  // 获取注册表覆盖报告（7 类覆盖 / 14 维覆盖）
  rpc GetCoverageReport(google.protobuf.Empty) returns (CoverageReport);

  // 注册服务健康检查
  rpc Health(google.protobuf.Empty) returns (RegistryHealth);
}

// ──────────────────────────────────────────────
// RegisterExpert
// ──────────────────────────────────────────────
message RegisterExpertRequest {
  string expert_id = 1;                    // 唯一 ID（如 "permission"）
  string dimension = 2;                     // 维度（14 维之一）
  repeated string supported_classes = 3;    // 支持的 7 类意图
  string description = 4;
  int64 avg_latency_ms = 5;
  double gate_a_rate_30d = 6;
  int32 priority = 7;
  repeated ToolDefinition tools = 8;
  map<string, string> metadata = 9;
  string endpoint = 10;                      // 专家服务端点（gRPC 或 HTTP）
  string tenant_id = 11;
}

// ──────────────────────────────────────────────
// GetExpert
// ──────────────────────────────────────────────
message GetExpertRequest {
  string expert_id = 1;
}

// ──────────────────────────────────────────────
// ListExperts
// ──────────────────────────────────────────────
message ListExpertsRequest {
  PageRequest page = 1;
  string dimension_filter = 2;       // 按维度过滤（可空）
  string class_filter = 3;            // 按支持的意图类过滤（可空）
  bool healthy_only = 4;              // 仅返回健康专家（默认 false）
  int32 min_priority = 5;             // 最低优先级（默认 0）
  string tenant_id = 6;
}

message ListExpertsResponse {
  repeated Expert experts = 1;
  PageResponse page = 2;
}

// ──────────────────────────────────────────────
// UpdateExpert
// ──────────────────────────────────────────────
message UpdateExpertRequest {
  string expert_id = 1;
  // 以下字段为可选更新（未设置的字段保持不变）
  google.protobuf.Struct update_mask = 2;
  repeated string supported_classes = 3;
  string description = 4;
  int64 avg_latency_ms = 5;
  double gate_a_rate_30d = 6;
  repeated ToolDefinition tools = 7;
  map<string, string> metadata = 8;
  string endpoint = 9;
}

// ──────────────────────────────────────────────
// DeleteExpert
// ──────────────────────────────────────────────
message DeleteExpertRequest {
  string expert_id = 1;
  bool force = 2;    // 强制删除（即使有正在执行的任务，默认 false）
}

message DeleteExpertResponse {
  bool deleted = 1;
  string expert_id = 2;
}

// ──────────────────────────────────────────────
// Heartbeat — 专家健康心跳
// ──────────────────────────────────────────────
message HeartbeatRequest {
  string expert_id = 1;
  bool healthy = 2;
  int64 current_load = 3;              // 当前负载（并发任务数）
  double recent_success_rate = 4;       // 近期成功率
  int64 recent_avg_latency_ms = 5;      // 近期平均延迟
  double recent_error_rate = 6;          // 近期错误率
  map<string, string> metrics = 7;       // 自定义指标
}

message HeartbeatResponse {
  bool accepted = 1;
  google.protobuf.Timestamp server_time = 2;
  int64 next_heartbeat_interval_ms = 3;  // 建议下次心跳间隔
}

// ──────────────────────────────────────────────
// DiscoverTools — 工具自动发现
// ──────────────────────────────────────────────
message DiscoverToolsRequest {
  string expert_id = 1;
  string grpc_reflection_endpoint = 2;  // gRPC 反射端点（可空，使用专家 endpoint）
  repeated string service_names = 3;      // 指定服务名（可空，扫描全部）
}

message DiscoverToolsResponse {
  string expert_id = 1;
  repeated ToolDefinition discovered_tools = 2;
  int32 total_discovered = 3;
  repeated string errors = 4;             // 发现过程中的错误
}

// ──────────────────────────────────────────────
// ValidateExpert — 3 项定义验证
// ──────────────────────────────────────────────
message ValidateExpertRequest {
  RegisterExpertRequest expert_definition = 1;
}

message ValidationIssue {
  string field = 1;
  string issue = 2;
  ValidationSeverity severity = 3;
}

enum ValidationSeverity {
  VALIDATION_SEVERITY_UNSPECIFIED = 0;
  VALIDATION_SEVERITY_ERROR = 1;    // 必须修复
  VALIDATION_SEVERITY_WARNING = 2;  // 建议修复
  VALIDATION_SEVERITY_INFO = 3;     // 提示
}

message ValidateExpertResponse {
  bool valid = 1;
  repeated ValidationIssue issues = 2;
  // 3 项验证结果
  bool tools_exist = 3;              // 工具存在性验证
  bool capabilities_complete = 4;    // 能力完整性验证
  bool naming_unique = 5;             // 命名唯一性验证
}

// ──────────────────────────────────────────────
// CoverageReport — 注册表覆盖报告
// ──────────────────────────────────────────────
message CoverageReport {
  int32 total_experts = 1;
  int32 healthy_experts = 2;
  // 7 类意图覆盖
  map<string, int32> class_coverage = 3;
  repeated string missing_classes = 4;
  // 14 维覆盖
  map<string, int32> dimension_coverage = 5;
  repeated string missing_dimensions = 6;
  // 工具总数
  int32 total_tools = 7;
  double avg_gate_a_rate = 8;
}

// ──────────────────────────────────────────────
// 注册服务健康状态
// ──────────────────────────────────────────────
message RegistryHealth {
  bool healthy = 1;
  string version = 2;
  int32 total_experts = 3;
  int32 healthy_experts = 4;
  int32 total_tools = 5;
  bool database_available = 6;
  google.protobuf.Timestamp started_at = 7;
}
