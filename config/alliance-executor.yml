# =============================================================
# 开发专家联盟 · 执行器配置（executor-svc）
# 规范依据：docs/standards/expert-alliance-port-norm.md（PORT-NORM-001）
# 加载优先级：内置默认 < 本文件 < 环境变量（MOX_ALLIANCE_*）
# 环境变量示例：
#   MOX_ALLIANCE_SERVER_PORT=3200
#   MOX_ALLIANCE_EXECUTOR_MODE=expert   # expert（生产）| mock（开发/测试）
#   MOX_ALLIANCE_STORAGE_MODE=memory
# 说明：旧环境变量 EXECUTOR_MODE 仍兼容（显式设置时覆盖本文件）
# =============================================================

# 服务器监听（核心服务 3000-3999 段，32=执行）
server:
  host: 0.0.0.0
  port: 3200

# 执行器业务参数（对应 ExecutorConfig）
executor:
  mode: expert                      # expert（生产，调用真实 AI 专家）| mock（仅开发/测试）
  max_concurrent_nodes: 50
  default_node_timeout_ms: 300000   # 5 分钟
  default_max_retries: 3
  poll_interval_ms: 100
  progress_update_interval_ms: 500

# 执行状态存储
storage:
  mode: file                        # file（文件快照）| memory（纯内存）
  path: data/alliance_executor_tasks.json
