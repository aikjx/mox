# ================================================================
# Workspace-level Clippy gate (enterprise code quality baseline)
# Migrated from platform/clippy.toml: clippy.toml only supports
# threshold configs; lint levels (allow/deny/warn) must be declared
# in the [workspace.lints.clippy] table (below).
# Run: cargo clippy --workspace --all-targets -- -D warnings
# ================================================================
[workspace.lints.clippy]
# allow: known-acceptable (intentional design / historical style)
new_without_default = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
module_inception = "allow"
# zero_prefixed_literal: error codes use two-segment format (01-001); leading zeros are semantic
zero_prefixed_literal = "allow"
# derivable_impls: hand-written impl is intentional (mox-error ErrorDomain)
derivable_impls = "allow"
# deny: must fix (correctness/safety)
# NOTE: lint groups correctness/suspicious are enforced via gate command:
#   cargo clippy --workspace --all-targets -- -D warnings -D clippy::correctness -D clippy::suspicious
out_of_bounds_indexing = "deny"
unused_result_ok = "deny"
duplicate_mod = "deny"

[workspace.package]
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT"
authors = ["Mox"]
description = "Unified Operator System - AI-Driven Full-Dimensional Breakthrough Platform"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rayon = "1.8"
http = "1"
hostname = "0.3"

# Math dependencies
nalgebra = "0.32"
ndarray = "0.15"
num-traits = "0.2"
approx = "0.5"

# Benchmarks (P4 鎬ц兘鍩虹嚎) - uniform default-features=false so operator-core & primiflow-fusion both inherit cleanly
criterion = { version = "0.5", default-features = false }

# WASM dependencies
wasmer = "4.2"
wasmer-compiler-cranelift = "4.2"

# Graph dependencies
petgraph = "0.6"

# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "limit"] }
tower = "0.4"

# HTTP client for AI APIs and browser automation
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography (audit SigV4, HMAC signatures, hex)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
crc64fast = { version = "1", optional = false, default-features = false }

# Randomness (unified across crates; T22 local volume + tests)
rand = "0.8"

# Concurrency utilities
parking_lot = "0.12"
async-trait = "0.1"

# Async / WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

# CLI framework for single-binary mox server
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }

# Observability
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# Persistence: query builder & SQL drivers (mox-system uses backends at compile-time)
sea-query = "0.32"
sqlx = "0.8"

