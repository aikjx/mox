[workspace]
# default-members：`cargo check / cargo build / cargo test` 默认只触发这些 crate
#   - 4 个 MOX 计算核心
#   - 3 个 FFI 绑定（napi/PyO3）不放默认，避免：
#       ① napi cdylib 需要本地 napi-rs CLI 预构建 + node-gyp 工具链
#       ② PyO3 abi3-py39 与当前默认 Python 3.8 不兼容
#     绑定编译需单独执行：`cargo check -p <binding-crate>`
default-members = [
    "platform/domains/data/core/mox-data-formula-core",
    "platform/domains/data/core/mox-data-norm-core",
    "platform/domains/ai/core/mox-ai-intent-core",
    "platform/domains/voice/core/mox-voice-dsp-core",
    "platform/domains/voice/svc/mox-voice-core-svc",
    "platform/domains/voice/svc/mox-voice-operator-svc",
    "platform/domains/voice/svc/mox-voice-intent-svc",
    "platform/domains/voice/svc/mox-voice-asr-svc",
]
members = [
    "platform/foundation/mox-platform-foundation",
    "platform/foundation/mox-cloud-foundation",
    "platform/domains/data/core/mox-data-formula-core",
    "platform/domains/data/core/mox-data-norm-core",
    "platform/domains/ai/core/mox-ai-intent-core",
    "platform/domains/voice/core/mox-voice-dsp-core",
    "platform/domains/flow/core/mox-flow-operator-core",
    "platform/domains/flow/core/mox-flow-optimizer-core",
    "platform/domains/kg/core/mox-kg-algo-core",
    "platform/domains/kg/core/mox-kg-meta-core",
    "platform/domains/data/core/mox-data-standards-core",
    "platform/domains/platform/core/mox-platform-system-core",
    "platform/domains/platform/core/mox-platform-iam-core",
    "platform/domains/platform/core/mox-platform-meta-core",
    "platform/domains/ai/core/mox-ai-core",
    "platform/domains/kg/svc/mox-kg-storage-svc",
    "platform/domains/kg/svc/mox-kg-service-svc",
    "platform/domains/kg/svc/mox-kg-streams-svc",
    "platform/domains/kg/svc/mox-kg-spark-svc",
    "platform/domains/kg/svc/mox-kg-hub-svc",
    "platform/domains/kg/svc/mox-kg-fusion-svc",
    "platform/domains/ai/svc/mox-ai-flow-svc",
    "platform/domains/ai/svc/mox-ai-expert-svc",
    "platform/domains/ai/svc/mox-ai-agent-svc",
    "platform/domains/flow/svc/mox-flow-operator-wasm-svc",
    "platform/domains/flow/svc/mox-flow-primiflow-svc",
    "platform/domains/flow/svc/mox-flow-fusion-svc",
    "platform/domains/flow/svc/mox-flow-bridge-svc",
    "platform/domains/data/svc/mox-data-plane-svc",
    "platform/domains/data/svc/mox-data-etl-svc",
    "platform/domains/data/svc/mox-data-compliance-svc",
    "platform/domains/data/svc/mox-data-catalog-svc",
    "platform/domains/cloud/svc/mox-cloud-master-svc",
    "platform/domains/cloud/svc/mox-cloud-volume-svc",
    "platform/domains/cloud/svc/mox-cloud-s3-svc",
    "platform/domains/cloud/svc/mox-cloud-filer-svc",
    "platform/domains/voice/svc/mox-voice-core-svc",
    "platform/domains/voice/svc/mox-voice-asr-svc",
    "platform/domains/voice/svc/mox-voice-intent-svc",
    "platform/domains/voice/svc/mox-voice-operator-svc",
    "platform/domains/market/svc/mox-market-template-svc",
    "platform/domains/platform/svc/mox-platform-orchestrator-svc",
    "platform/gateway/mox-platform-gateway-svc",
    "platform/domains/platform/sdk/mox-platform-test-harness",
    "platform/domains/voice/svc/mox-voice-desktop-app",
    "platform/domains/cloud/sdk/mox-cloud-sdk",
    "platform/domains/kg/sdk/mox-kg-sdk",
    "platform/domains/data/sdk/mox-data-formula-native",
    "platform/domains/data/sdk/mox-data-norm-intent-native",
    "platform/domains/voice/sdk/mox-voice-dsp-py",
    "platform/framework",
    "platform/domains/platform/core/mox-platform-iam-core",
    "platform/domains/platform/core/mox-platform-meta-core",
    "platform/domains/platform/core/mox-platform-datastore-core",
    "platform/domains/platform/core/mox-platform-orchestrator-core",
