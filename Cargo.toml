resolver = "2"

[workspace.package]
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT"
authors = ["Mox - 最高权限璇玑"]
description = "Unified Operator System - AI-Driven Full-Dimensional Breakthrough Platform"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rayon = "1.8"
http = "1"
hostname = "0.3"

# Math dependencies
nalgebra = "0.32"
ndarray = "0.15"
num-traits = "0.2"
approx = "0.5"

# Benchmarks (P4 性能基线) - uniform default-features=false so operator-core & primiflow-fusion both inherit cleanly
criterion = { version = "0.5", default-features = false }

# WASM dependencies
wasmer = "4.2"
wasmer-compiler-cranelift = "4.2"

# Graph dependencies
petgraph = "0.6"

# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "limit"] }
tower = "0.4"

# HTTP client for AI APIs and browser automation
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography (audit SigV4, HMAC signatures, hex)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
crc64fast = { version = "1", optional = false, default-features = false }

# Randomness (unified across crates; T22 local volume + tests)
rand = "0.8"

# Concurrency utilities
parking_lot = "0.12"
async-trait = "0.1"

# Async / WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

# CLI framework for single-binary mox server
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }

# Observability
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# Persistence: query builder & SQL drivers (mox-system uses backends at compile-time)
sea-query = "0.32"
sqlx = "0.8"

# Internal crates (归一化架构: 6层8域)
# Foundation 层
mox-platform-foundation = { path = "platform/foundation/mox-platform-foundation" }
mox-cloud-foundation = { path = "platform/foundation/mox-cloud-foundation" }
# Core 层
mox-data-formula-core = { path = "platform/domains/data/core/mox-data-formula-core" }
mox-data-norm-core = { path = "platform/domains/data/core/mox-data-norm-core" }
mox-data-standards-core = { path = "platform/domains/data/core/mox-data-standards-core" }
mox-ai-intent-core = { path = "platform/domains/ai/core/mox-ai-intent-core" }
mox-ai-core = { path = "platform/domains/ai/core/mox-ai-core" }
mox-voice-dsp-core = { path = "platform/domains/voice/core/mox-voice-dsp-core" }
mox-flow-operator-core = { path = "platform/domains/flow/core/mox-flow-operator-core" }
mox-flow-optimizer-core = { path = "platform/domains/flow/core/mox-flow-optimizer-core" }
mox-kg-algo-core = { path = "platform/domains/kg/core/mox-kg-algo-core" }
mox-kg-meta-core = { path = "platform/domains/kg/core/mox-kg-meta-core" }
mox-platform-system-core = { path = "platform/domains/platform/core/mox-platform-system-core" }
# Service 层 (kg)
mox-kg-storage-svc = { path = "platform/domains/kg/svc/mox-kg-storage-svc" }
mox-kg-service-svc = { path = "platform/domains/kg/svc/mox-kg-service-svc" }
mox-kg-streams-svc = { path = "platform/domains/kg/svc/mox-kg-streams-svc" }
mox-kg-spark-svc = { path = "platform/domains/kg/svc/mox-kg-spark-svc" }
mox-kg-hub-svc = { path = "platform/domains/kg/svc/mox-kg-hub-svc" }
mox-kg-fusion-svc = { path = "platform/domains/kg/svc/mox-kg-fusion-svc" }
# Service 层 (ai)
mox-ai-flow-svc = { path = "platform/domains/ai/svc/mox-ai-flow-svc" }
mox-ai-expert-svc = { path = "platform/domains/ai/svc/mox-ai-expert-svc" }
mox-ai-agent-svc = { path = "platform/domains/ai/svc/mox-ai-agent-svc" }
# Service 层 (flow)
