[workspace]
members = [
    "platform/services/operator-core",
    "platform/services/operator-wasm",
    "platform/services/graph-algorithms",
    "platform/services/optimizer",
    "platform/services/flow-ai",
    "platform/services/mox-expert",
    "platform/services/hermes-flow-bridge",
    "platform/services/business-catalog",
    "platform/services/ai-agent",
    "platform/services/template-market",
    "platform/gateway/runtime",
    "platform/services/mox-system",
    "platform/services/primiflow-core",
    "platform/services/primiflow-fusion",
    "platform/services/kg-hub",
    "platform/services/mox-common-meta",
    "platform/services/mox-domain-abstractions",
    "platform/services/mox-cloud-drive-master",
    "platform/services/mox-cloud-drive-volume",
    "platform/services/mox-standards",
    "platform/services/mox-graph-meta",
    "platform/services/mox-cloud-drive-s3",
    "platform/services/mox-graph-storage",
    "platform/sdk/rust/mox-sdk-cloud",
    "platform/sdk/rust/mox-sdk-graph",
    "platform/services/mox-cloud-drive-filer",
    "platform/services/mox-graph-service",
    "platform/services/mox-graph-streams",
    "platform/services/mox-graph-spark",
    "platform/services/mox-compliance",
    "platform/services/mox-fusion",
    "platform/services/mox-etl-wasm",
    "platform/services/mox-data-plane",
    "platform/services/mox-server",
    "platform/services/mox-t21-harness",
    "platform/services/mox-ai-core",
    # ===== MOX 计算密集核心（rust 最高性能算法权威单源） =====
    "platform/crates/mox-formulas-core",
    "platform/crates/mox-norm-core",
    "platform/crates/mox-intent-core",
    "platform/crates/xiaobai-dsp",
    # ===== Node.js napi 绑定（按需单独构建：需 node/npm 环境；默认不随 workspace check 触发）
    #   "platform/crates/bindings/mox-formulas-native",
    #   "platform/crates/bindings/mox-norm-intent-native",
    # ===== Python PyO3 扩展（按需单独构建：PYO3_PYTHON 必须指向 py39+；当前系统默认 py38 与 abi3-py39 冲突）
    #   "platform/crates/bindings/xiaobai-dsp-py",
]
resolver = "2"

[workspace.package]
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT"
authors = ["Mox - 最高权限璇玑"]
description = "Unified Operator System - AI-Driven Full-Dimensional Breakthrough Platform"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rayon = "1.8"
http = "1"
hostname = "0.3"

# Math dependencies
nalgebra = "0.32"
ndarray = "0.15"
num-traits = "0.2"
approx = "0.5"

# Benchmarks (P4 性能基线) - uniform default-features=false so operator-core & primiflow-fusion both inherit cleanly
criterion = { version = "0.5", default-features = false }

# WASM dependencies
wasmer = "4.2"
wasmer-compiler-cranelift = "4.2"

# Graph dependencies
petgraph = "0.6"

# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "limit"] }
tower = "0.4"

# HTTP client for AI APIs and browser automation
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography (audit SigV4, HMAC signatures, hex)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
crc64fast = { version = "1", optional = false, default-features = false }

# Randomness (unified across crates; T22 local volume + tests)
rand = "0.8"

# Concurrency utilities
parking_lot = "0.12"
async-trait = "0.1"

# Async / WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

# CLI framework for single-binary mox server
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }

# Observability
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# Persistence: query builder & SQL drivers (mox-system uses backends at compile-time)
sea-query = "0.32"
sqlx = "0.8"

# Internal crates
mox-common-meta = { path = "platform/services/mox-common-meta" }
mox-graph-service = { path = "platform/services/mox-graph-service" }

# ================================================================
# MOX 计算密集核心（统一 workspace 依赖版本，避免 FFI 绑定版本漂移）
# ================================================================
# 高性能哈希（比 std HashMap 快 2~3×，用于归一化/意图/Aho-Corasick goto）
hashbrown = { version = "0.15", features = ["rayon", "inline-more"] }
ahash = { version = "0.8", features = ["compile-time-rng", "serde"] }

# 数据结构辅助
bstr = "1.10"
indexmap = { version = "2.7", features = ["serde", "rayon"] }

# 多模式字符串匹配：Aho-Corasick（Rust 最高性能实现，支持 leftmost-first）
aho-corasick = "1.1"

# 并行迭代（rayon 已在 Core deps 声明，此处确保 feature 完整）
# SIMD f32 向量：f32x4（语音 DSP 响度归一/软限幅加速）
wide = "0.8"

# napi-rs 绑定（Node.js native，ABI-stable N-API）
napi = { version = "2.16", default-features = false, features = ["async", "serde-json", "napi8"] }
napi-derive = "2.16"

# PyO3 扩展（Python ≥3.9，abi3-py39 稳定 ABI，兼容 xiaobai_voice py312）
# numpy 数组互操作：pyo3 0.22 开始 numpy feature 移除，改用独立 numpy crate（0.22 对应 pyo3 0.22+）
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

# 内部核心 crates 路径
mox-formulas-core = { path = "platform/crates/mox-formulas-core" }
mox-norm-core = { path = "platform/crates/mox-norm-core" }
mox-intent-core = { path = "platform/crates/mox-intent-core" }
xiaobai-dsp = { path = "platform/crates/xiaobai-dsp" }
