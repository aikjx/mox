mox-flow-primiflow-svc = { path = "platform/domains/flow/svc/mox-flow-primiflow-svc" }
mox-flow-fusion-svc = { path = "platform/domains/flow/svc/mox-flow-fusion-svc" }
mox-flow-bridge-svc = { path = "platform/domains/flow/svc/mox-flow-bridge-svc" }
# Service 层 (data)
mox-data-plane-svc = { path = "platform/domains/data/svc/mox-data-plane-svc" }
mox-data-etl-svc = { path = "platform/domains/data/svc/mox-data-etl-svc" }
mox-data-compliance-svc = { path = "platform/domains/data/svc/mox-data-compliance-svc" }
mox-data-catalog-svc = { path = "platform/domains/data/svc/mox-data-catalog-svc" }
# Service 层 (cloud)
mox-cloud-master-svc = { path = "platform/domains/cloud/svc/mox-cloud-master-svc" }
mox-cloud-volume-svc = { path = "platform/domains/cloud/svc/mox-cloud-volume-svc" }
mox-cloud-s3-svc = { path = "platform/domains/cloud/svc/mox-cloud-s3-svc" }
mox-cloud-filer-svc = { path = "platform/domains/cloud/svc/mox-cloud-filer-svc" }
# Service 层 (voice)
mox-voice-core-svc = { path = "platform/domains/voice/svc/mox-voice-core-svc" }
mox-voice-asr-svc = { path = "platform/domains/voice/svc/mox-voice-asr-svc" }
mox-voice-intent-svc = { path = "platform/domains/voice/svc/mox-voice-intent-svc" }
mox-voice-operator-svc = { path = "platform/domains/voice/svc/mox-voice-operator-svc" }
# Service 层 (market)
mox-market-template-svc = { path = "platform/domains/market/svc/mox-market-template-svc" }
