# ================================================================
# Release Performance Optimization (workspace-wide)
# LTO + codegen-units=1 + opt-level=3 for maximum runtime performance
# Critical for rust-rocksdb FFI: reduces Rust-side call overhead, inlines hot functions
# ================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Fast release profile: faster compile, <5 perf loss
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4

# Bench profile
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
