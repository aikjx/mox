[workspace]
members = [
    "platform/services/operator-core",
    "platform/services/operator-wasm",
    "platform/services/graph-algorithms",
    "platform/services/optimizer",
    "platform/services/flow-ai",
    "platform/services/xuanji-expert",
    "platform/services/hermes-flow-bridge",
    "platform/services/business-catalog",
    "platform/services/ai-agent",
    "platform/services/template-market",
    "platform/gateway/runtime",
    "platform/services/xuanji-system",
    "platform/services/primiflow-core",
    "platform/services/primiflow-fusion",
    "platform/services/kg-hub",
    "platform/services/xuanji-common-meta",
    "platform/services/xuanji-domain-abstractions",
    "platform/services/xuanji-cloud-drive-master",
    "platform/services/xuanji-cloud-drive-volume",
    "platform/services/xuanji-standards",
    "platform/services/xuanji-graph-meta",
    "platform/services/xuanji-cloud-drive-s3",
    "platform/services/xuanji-graph-storage",
    "platform/sdk/rust/xuanji-sdk-cloud",
    "platform/sdk/rust/xuanji-sdk-graph",
    "platform/services/xuanji-cloud-drive-filer",
    "platform/services/xuanji-graph-service",
    "platform/services/xuanji-graph-streams",
    "platform/services/xuanji-graph-spark",
    "platform/services/xuanji-compliance",
    "platform/services/xuanji-fusion",
    "platform/services/xuanji-etl-wasm",
    "platform/services/xuanji-data-plane",
    "platform/services/xuanji-server",
]
resolver = "2"

[workspace.package]
version = "3.0.0-ai-powered"
edition = "2021"
license = "MIT"
authors = ["Xuanji - 最高权限璇玑"]
description = "Unified Operator System - AI-Driven Full-Dimensional Breakthrough Platform"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rayon = "1.8"
http = "1"
hostname = "0.3"

# Math dependencies
nalgebra = "0.32"
ndarray = "0.15"
num-traits = "0.2"
approx = "0.5"

# Benchmarks (P4 性能基线) - uniform default-features=false so operator-core & primiflow-fusion both inherit cleanly
criterion = { version = "0.5", default-features = false }

# WASM dependencies
wasmer = "4.2"
wasmer-compiler-cranelift = "4.2"

# Graph dependencies
petgraph = "0.6"

# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "limit"] }
tower = "0.4"

# HTTP client for AI APIs and browser automation
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography (audit SigV4, HMAC signatures, hex)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
crc64fast = { version = "1", optional = false, default-features = false }

# Concurrency utilities
parking_lot = "0.12"
async-trait = "0.1"

# Async / WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

# CLI framework for single-binary xuanji server
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }

# Observability
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# Persistence: query builder & SQL drivers (xuanji-system uses backends at compile-time)
sea-query = "0.32"
sqlx = "0.8"

# Internal crates
xuanji-common-meta = { path = "platform/services/xuanji-common-meta" }
