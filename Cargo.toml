mox-data-formula-native = { path = "platform/domains/data/sdk/mox-data-formula-native" }
mox-data-norm-intent-native = { path = "platform/domains/data/sdk/mox-data-norm-intent-native" }
mox-voice-dsp-py = { path = "platform/domains/voice/sdk/mox-voice-dsp-py" }
# Framework 层
mox-framework = { path = "platform/framework" }

# ================================================================
# MOX 计算密集核心（统一 workspace 依赖版本，避免 FFI 绑定版本漂移）
# ================================================================
# 高性能哈希（比 std HashMap 快 2~3×，用于归一化/意图/Aho-Corasick goto）
# 版本锁定 0.17：与 indexmap 2.7 / serde_json 内建 hashbrown 依赖一致，避免双版本冲突
# serde feature：使 hashbrown::HashMap<K, V, S> 直接支持 Serialize/Deserialize（无需手动远程 impl）
hashbrown = { version = "0.17", features = ["rayon", "inline-more", "serde"] }
ahash = { version = "0.8", features = ["compile-time-rng", "serde"] }

# 数据结构辅助
bstr = "1.10"
indexmap = { version = "2.7", features = ["serde", "rayon"] }

# 多模式字符串匹配：Aho-Corasick（Rust 最高性能实现，支持 leftmost-first）
aho-corasick = "1.1"

# 并行迭代（rayon 已在 Core deps 声明，此处确保 feature 完整）
# SIMD f32 向量：f32x4（语音 DSP 响度归一/软限幅加速）
wide = "0.8"

# napi-rs 绑定（Node.js native，ABI-stable N-API）
napi = { version = "2.16", default-features = false, features = ["async", "serde-json", "napi8"] }
napi-derive = "2.16"

# PyO3 扩展（Python ≥3.9，abi3-py39 稳定 ABI，兼容 xiaobai_voice py312）
# numpy 数组互操作：pyo3 0.22 开始 numpy feature 移除，改用独立 numpy crate（0.22 对应 pyo3 0.22+）
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

# 内部核心 crates 路径已统一移至上方 Internal crates 段（归一化架构）

# 小白专用：正则（PPR 路由、应用别名匹配、应用列表过滤）
regex = "1.10"
# 系统级热键（BallWidget 全局 Alt+X 录音）
global-hotkey = "0.5"
# 跨平台剪贴板（copy_to_clipboard、中文 type_text 粘贴回退）
arboard = "3.4"
# 跨平台键鼠输入（mouse_move/click、key_press、type_text ASCII 路径）
enigo = { version = "0.2", default-features = false, features = ["serde"] }
# Windows 原生 API（coreaudio 音量设置、win32 进程列表、shell 回收站移动）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Environment",
] }
# 跨平台音频 I/O（麦克风录音、TTS 播放；ASR 可用 alsa/pulseaudio/windows wasapi 回退）
cpal = "0.15"
# 跨平台截图（L3 screenshot 动作，mss 等价 Rust 实现；crates.io 最新 0.8.x）
screenshots = "0.8"
# 模糊匹配（FR-5 S3 post-hoc 热词编辑距离替换、中文热词近似纠错）
strsim = "0.11"
# HTTP body bytes 原语（axum 0.7 / http-body-util 0.1 配套）
bytes = "1"
# axum 0.7 Full 依赖的 body adapter（WS 握手/空 body）
http-body-util = "0.1"
# FR-5 S2 热词临时文件（NamedTempFile Drop 自动删除）
tempfile = "3"
